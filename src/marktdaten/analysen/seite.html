// --- Charts in der Optik von iC Charts: dieselbe Bibliothek (TradingView Lightweight Charts) und Zeichenebene ---
const DASH_PORT = (+location.port || 8813) - 1;                       // Dashboard = Analysen − 1 (echt 8812, Demo 8822)
const IC = `${location.protocol}//${location.hostname}:${DASH_PORT}/ic-charts/`;
const ICC = { bg: "#0e1218", grid: "rgba(255,255,255,0.045)", text: "#7d8794", line: "#1a2029", up: "#2fcf7a", down: "#f05454", accent: "#f5b942" };   // Finanz-Design: Töne wie das Dashboard
let LW_BEREIT = null, LW_CHARTS = [];
function lwLaden() {
  if (!LW_BEREIT) LW_BEREIT = new Promise((ok, fehl) => {
    const skript = (src, weiter) => { const e = document.createElement("script"); e.src = src; e.onload = weiter; e.onerror = () => fehl(new Error(src)); document.head.append(e); };
    skript(IC + "lib/lightweight-charts.standalone.production.js", () => skript(IC + "drawings.js", ok));
  });
  return LW_BEREIT;
}
function lwAufraeumen() { LW_CHARTS.forEach(c => { try { c.remove(); } catch (e) {} }); LW_CHARTS = []; }
const berlinVersatz = t => { const d = new Date(t * 1000); return (new Date(d.toLocaleString("en-US", { timeZone: "Europe/Berlin" })) - new Date(d.toLocaleString("en-US", { timeZone: "UTC" }))) / 1000; };
const TONE = { bullisch: "bull", "bärisch": "bear", neutral: "pattern" };

async function zeichneChart(el, k, formationen, auswahl, opt = {}) {
  try { await lwLaden(); return lwChart(el, k, formationen, auswahl, opt); }
  catch (e) { kerzenChart(el, k.slice(-(opt.sichtbar || 140)), formationen, auswahl, opt); }   // Dashboard nicht erreichbar: eigener SVG-Chart
}

function lwChart(el, k, formationen, auswahl, opt = {}) {
  const LW = window.LightweightCharts, tf = opt.tf || FZ.tf, n = k.length;
  const box = document.createElement("div"); box.className = "lw"; box.style.height = opt.hoehe === "voll" ? "100%" : (opt.hoehe || 380) + "px"; el.append(box);
  const tage = tf === "1d";
  const zeit = t => tage ? t : t + berlinVersatz(t);                 // Achse in Berliner Zeit
  const chart = LW.createChart(box, {
    autoSize: true,
    layout: { attributionLogo: false, background: { type: "solid", color: ICC.bg }, textColor: ICC.text, fontSize: 11, fontFamily: '"JetBrains Mono", ui-monospace, Menlo, monospace' },
    grid: { vertLines: { color: ICC.grid, style: LW.LineStyle.Dotted }, horzLines: { color: ICC.grid, style: LW.LineStyle.Dotted } },
    crosshair: { mode: LW.CrosshairMode.Normal, vertLine: { color: "rgba(245,185,66,0.55)", width: 1, style: LW.LineStyle.Dashed, labelBackgroundColor: "#3a3324" },
                 horzLine: { color: "rgba(245,185,66,0.55)", width: 1, style: LW.LineStyle.Dashed, labelBackgroundColor: "#3a3324" } },
    rightPriceScale: { borderColor: ICC.line, scaleMargins: { top: 0.1, bottom: 0.2 } },
    timeScale: { borderColor: ICC.line, timeVisible: !tage, secondsVisible: false, rightOffset: 4 },
    localization: { locale: "de-DE" },
    handleScroll: { mouseWheel: false, pressedMouseMove: true, horzTouchDrag: true }, handleScale: { mouseWheel: !!opt.zoom, pinch: true },
  });
  if (!opt.eigen) LW_CHARTS.push(chart);
  const candle = chart.addCandlestickSeries({ upColor: ICC.up, downColor: ICC.down, borderUpColor: ICC.up, borderDownColor: ICC.down, wickUpColor: ICC.up, wickDownColor: ICC.down });
  const vol = chart.addHistogramSeries({ priceScaleId: "vol", priceFormat: { type: "volume" }, lastValueVisible: false, priceLineVisible: false });
  chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.84, bottom: 0 } });
  const ema = chart.addLineSeries({ color: "#ff9f43", lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
  const daten = [], volumen = [], ema21 = [];
  let e = null, letzte = -Infinity;
  k.forEach(([t, o, h, l, c, v]) => {
    const z = zeit(t); if (z <= letzte) return; letzte = z;
    daten.push({ time: z, open: o, high: h, low: l, close: c });
    volumen.push({ time: z, value: v || 0, color: c >= o ? "rgba(61,220,151,0.32)" : "rgba(255,107,122,0.32)" });
    e = e == null ? c : c * 2 / 22 + e * 20 / 22; if (daten.length > 20) ema21.push({ time: z, value: e });
  });
  candle.setData(daten); vol.setData(volumen); ema.setData(ema21);
  if (opt.indikatoren) {                                              // SMA 50/200 und Bollinger 20/2 wie in iC Charts
    const linie = (farbe, w = 1.5, stil = 0) => chart.addLineSeries({ color: farbe, lineWidth: w, lineStyle: stil, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
    const cs = daten.map(d => d.close), reihe = (n_, f) => daten.map((d, i) => i >= n_ - 1 ? { time: d.time, value: f(cs.slice(i - n_ + 1, i + 1)) } : null).filter(Boolean);
    const mittel = a => a.reduce((s_, v) => s_ + v, 0) / a.length, sd = a => { const m_ = mittel(a); return Math.sqrt(a.reduce((s_, v) => s_ + (v - m_) ** 2, 0) / a.length); };
    if (daten.length >= 50) linie("#ffd166").setData(reihe(50, mittel));
    if (daten.length >= 200) linie("#b8a2ff").setData(reihe(200, mittel));
    linie("rgba(77,141,255,0.9)", 1).setData(reihe(20, a => mittel(a) + 2 * sd(a)));
    linie("rgba(77,141,255,0.5)", 1, 2).setData(reihe(20, mittel));
    linie("rgba(77,141,255,0.9)", 1).setData(reihe(20, a => mittel(a) - 2 * sd(a)));
  }
  // Formationen auf die Zeichenebene von iC Charts
  const layer = new window.Drawings.Layer({ up: ICC.up, down: ICC.down, accent: ICC.accent, fmt: v => F(v, v < 10 ? 3 : 2) });
  candle.attachPrimitive(layer);
  const zeiten = k.map(x => x[0]);
  const idx = t => { if (t <= zeiten[0]) return (t - zeiten[0]) / ((zeiten[1] - zeiten[0]) || 1); if (t >= zeiten[n - 1]) return n - 1 + (t - zeiten[n - 1]) / ((zeiten[n - 1] - zeiten[n - 2]) || 1);
    let lo = 0, hi = n - 1; while (lo < hi) { const mid = (lo + hi) >> 1; if (zeiten[mid] < t) lo = mid + 1; else hi = mid; } return lo; };
  const pt = (t, p) => ({ idx: idx(t), price: p });
  const marker = [];
  formationen.forEach((f, i) => {
    if (auswahl != null && i !== auswahl) return;
    const ton = TONE[f.richtung] || "pattern", kurz = f.name.replace(/ (bestätigt|gebrochen)$/, "").replace(/: Ausbruch.*$/, "");
    if (f.zone) { layer.add({ type: "zone", p1: f.zone[0], p2: f.zone[1], idx0: f.punkte.length ? idx(f.punkte[0][0]) : n - 60, idx1: n + 3, label: kurz, kind: f.art === "widerstand" ? "resistance" : "support" }); }
    if (f.linien.length === 2) {                                       // Fläche zwischen zwei Linien (Dreieck, Keil, Kanal, Rechteck, Flagge)
      const [a, b] = f.linien;
      layer.add({ type: "poly", pts: [pt(a.t1, a.p1), pt(a.t2, a.p2), pt(b.t2, b.p2), pt(b.t1, b.p1)], closed: true, label: "", kind: ton });
    }
    f.linien.forEach((l, j) => layer.add({ type: "line", a: pt(l.t1, l.p1), b: pt(l.t2, l.p2), extend: f.art === "trendlinie", dashed: l.art === "nackenlinie",
      label: j === 0 && f.linien.length !== 2 ? kurz : j === 1 ? kurz : "", kind: l.art === "unterstuetzung" ? "support" : l.art === "widerstand" ? "resistance" : ton }));
    if (f.punkte.length >= 3 && f.linien.length !== 2 && !["unterstuetzung", "widerstand", "trendlinie"].includes(f.art))
      layer.add({ type: "poly", pts: f.punkte.map(([t, p]) => pt(t, p)), closed: false, label: f.linien.length ? "" : kurz, kind: ton });
    if (!f.linien.length && !f.zone && f.punkte.length) { const [t, p] = f.punkte[f.punkte.length - 1]; layer.add({ type: "note", idx: idx(t), price: p, text: kurz, kind: ton === "pattern" ? "neutral" : ton, above: f.richtung !== "bullisch" }); }
    if (f.ziel && opt.ziele !== false) layer.add({ type: "level", price: f.ziel, idx0: Math.max(0, n - 20), label: "Ziel", kind: f.richtung === "bärisch" ? "resistance" : "support" });
    if (f.ereignis_t && f.linien.length && (f.status === "bestätigt" || f.status === "gebrochen")) {
      const bull = f.richtung === "bullisch";
      marker.push({ time: zeit(zeiten[Math.min(n - 1, Math.round(idx(f.ereignis_t)))]), position: bull ? "belowBar" : "aboveBar", shape: bull ? "arrowUp" : "arrowDown", color: bull ? ICC.up : ICC.down, text: "Ausbruch" });
    }
  });
  for (const z of opt.marker || []) marker.push({ ...z, time: zeit(z.t) });
  marker.sort((a, b) => a.time - b.time); candle.setMarkers(marker);
  for (const l of opt.niveaus || []) candle.createPriceLine({ price: l.preis, color: l.farbe, lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: l.titel });
  const sichtbar = Math.min(n, opt.sichtbar || 140);
  chart.timeScale().setVisibleLogicalRange({ from: n - sichtbar, to: n + 3 });
  if (n > sichtbar && !BILD) box.insertAdjacentHTML("beforeend", `<div class="lw-hinweis">ziehen für ältere Kerzen</div>`);
  return chart;
}

function vorbereiten(el, x) {

  const sym = x.wert.symbol, cl = CH.daten.claude, c = cl && cl.werte ? cl.werte[sym] : null;
  const alt = c && cl.stand_daten && cl.stand_daten[sym] !== x.zeit;
  const wahl = sym in CH.offen ? CH.offen[sym] : (x.formationen.length ? 0 : null);
  const quelle = { DE: "Xetra · 15 Min. verzögert", US: "US · IEX live", KRYPTO: "Binance live" }[x.wert.markt] || "";
  const sig = x.signale || [], frische = sig.filter(s_ => s_.frisch).length, b_ = x.bestaetigung;
  const reihen = x.vorschlaege.map((v, i) => ({ v, i, empf: c && c.alarm === i })).sort((p, q) => q.empf - p.empf);
  return { sym, cl, c, alt, wahl, quelle, sig, frische, b_, reihen, mehrAlarme: CH.mehr[sym] };
}
const kopfZeile = (x, nr, sym, quelle) => `<div class="cw-kopf"><span class="nr">${nr}</span><h3>${esc(x.wert.name)}</h3><span class="sym">${esc(sym)} · ${TF_NAME[x.tf] || x.tf} · ${quelle}</span>
  <span class="kurs zahl">${fpreis(x.kurs)}</span><span class="ver zahl ${x.veraenderung_pct >= 0 ? "pos" : "neg"}" title="über die letzten 60 Kerzen">${x.veraenderung_pct > 0 ? "+" : ""}${F(x.veraenderung_pct, 2)} %</span></div>`;
const fussKnoepfe = () => `<button class="leise" data-aktion="detail">Details</button><button class="leise" data-aktion="icharts">In iC Charts</button>`;

// Claudes Einordnung als Text über Chart und rechter Spalte; „mehr“ klappt an Ort und Stelle auf
function einordnung(c, cl, sym, alt) {
  if (!c) return `<div class="cw-einordnung leer"><span class="eo-marke">✦ Einordnung von Claude</span> <span class="eo-zeit">noch keine</span></div>`;
  return `<div class="cw-einordnung ${CH.lang[sym] ? "offen" : ""}">
    <div class="eo-kopf"><span class="eo-marke">✦ Einordnung von Claude</span><span class="eo-zeit">${UHRZ(Date.parse(cl.zeit) / 1000)} Uhr${alt ? " · seitdem neue Kerzen" : ""}</span></div>
    <div class="eo-text">${esc(c.text)}</div>
    <button class="eo-mehr">${CH.lang[sym] ? "weniger" : "mehr"}</button></div>`;
}
function einordnungKnopf(el, sym) {
  const box = el.querySelector(".cw-einordnung"), text = el.querySelector(".eo-text"), knopf = el.querySelector(".eo-mehr");
  if (!knopf) return;
  if (!CH.lang[sym] && text.scrollHeight <= text.clientHeight + 2) { knopf.hidden = true; box.classList.add("passt"); return; }
  knopf.onclick = () => { CH.lang[sym] = !CH.lang[sym]; box.classList.toggle("offen", CH.lang[sym]); knopf.textContent = CH.lang[sym] ? "weniger" : "mehr"; };
}
function chartKarte(el, x, nr) {
  const { sym, cl, c, alt, wahl, quelle, sig, frische, b_, reihen, mehrAlarme } = vorbereiten(el, x);
  const tab = CH.tab[sym] || "formationen";
  el.style.setProperty("--cw-h", KARTE_H + "px");
  el.innerHTML = `<div class="cw-titel">${kopfZeile(x, nr, sym, quelle)}</div>${einordnung(c, cl, sym, alt)}<div class="cw-chart">
      <div class="cw-bild"><button class="vollknopf" title="Vollbild">⛶ Vollbild</button></div></div>
    <div class="cw-seite v1">
      ${kennzahlen(x, b_, frische)}
      <div class="reiterleiste" role="tablist">
        <button data-tab="formationen" aria-selected="${tab === "formationen"}">Formationen <small>${x.formationen.length}</small></button>
        <button data-tab="indikatoren" aria-selected="${tab === "indikatoren"}">Indikatoren <small>${sig.length}</small></button>
        <button data-tab="alarme" aria-selected="${tab === "alarme"}">Alarme <small>${x.vorschlaege.length}</small></button>
      </div>
      <div class="reiterinhalt">${tab === "formationen" ? formationsListe(x, wahl) : tab === "indikatoren" ? indikatorListe(sig) : alarmListe(x, sym, c, reihen, mehrAlarme)}</div>
      <div class="cw-fuss">${fussKnoepfe()}</div>
    </div>`;
  const bild = el.querySelector(".cw-bild"), neu = () => chartKarte(el, x, nr);
  requestAnimationFrame(() => zeichneChart(bild, x.kerzen, x.formationen, wahl, { kompakt: true, hoehe: KARTE_H - 26, tf: x.tf, sichtbar: x.sichtbar, indikatoren: tab === "indikatoren" }).then(ch => { el._lw = ch; }));
  ereignisse(el, x, nr, sym, wahl, tab, c, sig, neu);
  einordnungKnopf(el, sym);
}

// Vollbild: großer Chart mit Zoom, Formationen und Indikatoren per Knopf; Esc oder „Schließen“ beendet
function vollbild(x, wahl, mitIndikatoren) {
  document.querySelector(".vollbild")?.remove();
  const v = document.createElement("div"); v.className = "vollbild"; document.body.append(v);
  let aus = wahl, ind = mitIndikatoren, chart = null, zu = false;
  const weg = () => { if (chart) { try { chart.remove(); } catch (e) {} chart = null; } };
  const zeichnenVB = () => {
    weg();
    v.innerHTML = `<div class="vb-kopf"><h3>${esc(x.wert.name)}</h3><span class="sym">${esc(x.wert.symbol)} · ${TF_NAME[x.tf] || x.tf} · Kurs ${fpreis(x.kurs)}</span>
      <div class="vb-chips"><button data-alle class="${aus == null ? "an" : ""}">alle Formationen</button>${x.formationen.map((f, i) => `<button data-f="${i}" class="${aus === i ? "an" : ""}">${esc(f.name.replace(/: Ausbruch.*$/, ""))}${f.guete != null ? " · " + f.guete : ""}</button>`).join("")}
      <button data-ind class="${ind ? "an" : ""}">Indikatoren</button></div><button class="vb-zu">Schließen (Esc)</button></div><div class="vb-chart"></div>`;
    zeichneChart(v.querySelector(".vb-chart"), x.kerzen, x.formationen, aus, { hoehe: "voll", tf: x.tf, sichtbar: x.kerzen.length, zoom: true, indikatoren: ind, eigen: true })
      .then(c => { if (zu) { try { c.remove(); } catch (e) {} } else chart = c; });
    v.querySelector("[data-alle]").onclick = () => { aus = null; zeichnenVB(); };
    v.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { aus = +b.dataset.f; zeichnenVB(); });
    v.querySelector("[data-ind]").onclick = () => { ind = !ind; zeichnenVB(); };
    v.querySelector(".vb-zu").onclick = schliessen;
  };
  const taste = e => { if (e.key === "Escape") schliessen(); };
  const vollWeg = () => { if (!document.fullscreenElement) schliessen(); };   // Browser-Esc beendet das Vollbild: Ansicht mit schließen
  function schliessen() {
    if (zu) return; zu = true;
    removeEventListener("keydown", taste); document.removeEventListener("fullscreenchange", vollWeg);
    weg(); v.remove();
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }
  addEventListener("keydown", taste);
  const start = () => { if (!zu) zeichnenVB(); };
  if (v.requestFullscreen) v.requestFullscreen().then(() => { document.addEventListener("fullscreenchange", vollWeg); start(); }).catch(start);
  else start();
}

function datenlage(d) {

}
function leerBuch(m, d) {

// Erklärtexte einklappen („Was heißt das?“) und Sprungleiste für lange Reiter
function nacharbeiten(m) {
  m.querySelectorAll(".erklaerung").forEach(p => {
    const r = p.previousElementSibling;
    if (!r || !r.classList.contains("rubrik") || p.classList.contains("klappbar")) return;
    p.classList.add("klappbar");
    const b = document.createElement("button"); b.className = "erkl-knopf"; b.type = "button"; b.textContent = "Was heißt das?";
    b.onclick = () => { p.classList.toggle("offen"); b.textContent = p.classList.contains("offen") ? "zuklappen" : "Was heißt das?"; };
    r.appendChild(b);
  });
  if (["orderbuch", "handel"].includes(REITER)) {
    const titel = [...m.querySelectorAll(":scope > .rubrik h2")];
    if (titel.length > 2) {
      const leiste = document.createElement("div"); leiste.className = "sprung";
      titel.forEach(h => { const b = document.createElement("button"); b.textContent = h.textContent; b.onclick = () => h.closest(".rubrik").scrollIntoView({ behavior: "smooth", block: "start" }); leiste.append(b); });
      m.prepend(leiste);
    }
  }
  document.documentElement.style.setProperty("--kopf-h", $(".kopf").offsetHeight + "px");
  alarmZahl();
  if (SPRUNG) { const ziel = SPRUNG; SPRUNG = null; setTimeout(() => hervorheben(ziel), 200); }
}

function leerAbschnitt(m) { m.insertAdjacentHTML("beforeend", `<div class="karte leer"><h3>Zu wenig Daten</h3>Für diesen Teil braucht es das Xetra-Buch aus dem fortlaufenden Handel (9 bis 17:30 Uhr). Das Buch zeichnet der Sammler nur live auf, das Nachladen holt nur Abschlüsse. Ein Tag füllt sich also, während er läuft. Die Reiter Handelsplätze und Auktionen zeigen schon jetzt, was die Abschlüsse hergeben.</div>`); }

let PARAM = {};
const OHNE_TAG = ["charts", "pruefstein", "pruefstand", "alarme", "claude"];                    // eigene Auswahl bzw. ohne Wert, unabhängig vom Orderbuch-Tag
async function zeichnen() {
  try { await zeichnenInnen(); } finally { const m = $("#inhalt"); nacharbeiten(m); kontextSenden(); }
}
async function zeichnenInnen() {
  const m = $("#inhalt"); lwAufraeumen(); m.innerHTML = ""; m.className = "";
  document.querySelectorAll("#unterreiter button").forEach(b => b.setAttribute("aria-selected", b.dataset.ziel === REITER));
  const eigen = OHNE_TAG.includes(REITER);
  ["#wert", "#tag"].forEach(s => $(s).parentElement.hidden = eigen);
  $("#neu").hidden = eigen;
  if (REITER === "charts") { $("#stand").textContent = "Formationen nach festen Regeln · Einordnung von Claude · Alarme per Klick"; return A.charts(m); }
  if (REITER === "alarme") { $("#stand").textContent = "Alarme werden alle 30 s auf dem Server geprüft und per Telegram gemeldet"; return A.alarme(m); }
  if (REITER === "pruefstand") { $("#stand").textContent = "Ideen-Labor · Strategie in Worten · Claude übersetzt · ehrlicher Backtest mit gesperrtem Prüfteil"; return A.pruefstand(m); }
  if (REITER === "pruefstein") { $("#stand").textContent = "Rückblick ohne Blick in die Zukunft · Tageskerzen der Watchlist · Kursziele nach Bulkowski"; return A.pruefstein(m); }
  if (REITER === "claude") { $("#stand").textContent = "Morgenlage und Nachbesprechung · Bilanz der Einschätzungen · Dossiers je Wert"; return A.claude(m); }
  if (!DATEN) { if (UEB && UEB.tage.length) laden(); return; }
  if (DATEN.fehler) { m.innerHTML = `<div class="karte leer"><h3>Fehler</h3>${esc(DATEN.fehler)}</div>`; return; }
  $("#stand").innerHTML = datenlage(DATEN).text;
  return A[REITER](DATEN, m);
}
// Reiter Alarme: Zahl der aktiven Alarme als Plakette, frisch ausgelöste (letzte 24 Std.) lassen sie pulsieren
async function alarmZahl() {
  let d; try { d = await (await fetch("api/alarme")).json(); } catch (e) { return; }
  const aktiv = (d.regeln || []).filter(x => x.aktiv).length;
  const frisch = (d.regeln || []).some(x => x.ausgeloest && Date.now() - Date.parse(x.ausgeloest) < 864e5);
  const z = $("#alarm-zahl");
  z.hidden = !aktiv; z.textContent = aktiv; z.classList.toggle("frisch", frisch);
  z.closest("button").title = `${aktiv} aktive ${aktiv === 1 ? "Alarm" : "Alarme"}${frisch ? " · in den letzten 24 Stunden ausgelöst" : ""}`;
}
setInterval(alarmZahl, 60000);
document.querySelectorAll("#unterreiter button").forEach(b => b.onclick = () => { reiterSetzen(b.dataset.ziel); if (REITER === "charts") CH.detail = null; zeichnen(); });

async function uebersicht() {
  UEB = await (await fetch("api/uebersicht")).json();
  const tagWahl = $("#tag"), wertWahl = $("#wert");
  const altTag = tagWahl.value, altWert = wertWahl.value;
  if (!UEB.tage.length) {
    if (!OHNE_TAG.includes(REITER)) {
      $("#inhalt").innerHTML = `<div class="karte leer"><h3>Noch keine Rohdaten</h3>Das Dashboard legt die Minutendateien, die es ohnehin abholt, gefiltert unter <code>${esc(UEB.roh)}</code> ab. Sobald dort der erste Handelstag liegt, erscheinen hier die Analysen. Dieser Reiter ruft selbst nichts bei den Börsen ab.</div>`;
      $("#stand").textContent = "wartet auf Rohdaten";
    } else zeichnen();
    return false;
  }
  tagWahl.innerHTML = UEB.tage.map(t => `<option value="${t.tag}">${new Date(t.tag + "T12:00:00Z").toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" })}</option>`).join("");
  if (altTag && UEB.tage.some(t => t.tag === altTag)) tagWahl.value = altTag;
  werteFuellen(altWert);
  return true;
}
function werteFuellen(alt) {
  const tag = UEB.tage.find(t => t.tag === $("#tag").value), da = new Set(tag ? tag.werte : []);
  const werte = UEB.werte.filter(w => da.has(w.id));
  $("#wert").innerHTML = werte.map(w => `<option value="${w.id}">${esc(w.name)} (${esc(w.symbol)})</option>`).join("");
  let gemerkt = alt; try { gemerkt = gemerkt || localStorage.getItem("analysen-wert"); } catch (e) {}
  if (gemerkt && werte.some(w => w.id === gemerkt)) $("#wert").value = gemerkt;
}

async function laden() {
  const isin = $("#wert").value, tag = $("#tag").value;
  if (!isin || !tag) return;
  try { localStorage.setItem("analysen-wert", isin); } catch (e) {}
  if (!OHNE_TAG.includes(REITER)) $("#stand").textContent = "rechnet …";
  const q = new URLSearchParams({ isin, tag, ...PARAM });
  try {
    const r = await fetch("api/analyse?" + q);
    DATEN = await r.json();
    if (!r.ok && !DATEN.fehler) DATEN.fehler = "keine Rohdaten";
  } catch (e) { DATEN = { fehler: String(e) }; }
  if (!OHNE_TAG.includes(REITER)) await zeichnen();
}
$("#tag").onchange = () => { werteFuellen($("#wert").value); laden(); };
$("#wert").onchange = laden;
$("#neu").onclick = async () => { await uebersicht(); laden(); };
