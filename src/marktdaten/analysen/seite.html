<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analysen</title>
<style>
/* Gestaltung wie das Dashboard (Portfolio Agent); Datenfarben aus der geprüften Standardpalette:
   Reihe 1 Blau (Kauf, Xetra), Reihe 2 Orange (Verkauf, Tradegate), Reihe 3 Aqua (Cboe). */
:root {
  color-scheme: light;
  --flaeche: #f9f9f7; --karte: #fcfcfb; --karte-tief: #f2f2ef;
  --ton-1: #0b0b0b; --ton-2: #52514e; --ton-3: #898781;
  --linie: #e1e0d9; --linie-stark: #c3c2b7; --gitter: #ecebe6;
  --akzent: #056343; --akzent-weich: #e7f2ee;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #6250d6;
  --pos: #2a78d6; --neg: #e34948; --mitte-grau: #f0efec;
  --gut: #0ca30c; --warnung: #fab219; --kritisch: #d03b3b;
  --warnung-weich: #fdf4e2; --kritisch-weich: #fbecec;
  --radius: 9px; --radius-s: 6px; --schatten: 0 1px 2px rgb(0 0 0 / 0.04);
  --t-mikro: 10.5px; --t-klein: 11.5px; --t-text: 12.5px; --t-ui: 13px; --t-zahl: 17px; --t-wert: 21px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-thema="hell"]) {
    color-scheme: dark;
    --flaeche: #0d0d0d; --karte: #1a1a19; --karte-tief: #232322;
    --ton-1: #ffffff; --ton-2: #c3c2b7; --ton-3: #9d9b94;
    --linie: #2c2c2a; --linie-stark: #383835; --gitter: #262625;
    --akzent: #4fc79a; --akzent-weich: #14251f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #9085e9;
    --pos: #3987e5; --neg: #e66767; --mitte-grau: #383835;
    --warnung-weich: #2a2113; --kritisch-weich: #2c1615; --schatten: none;
  }
}
:root[data-thema="dunkel"] {
  color-scheme: dark;
  --flaeche: #0d0d0d; --karte: #1a1a19; --karte-tief: #232322;
  --ton-1: #ffffff; --ton-2: #c3c2b7; --ton-3: #9d9b94;
  --linie: #2c2c2a; --linie-stark: #383835; --gitter: #262625;
  --akzent: #4fc79a; --akzent-weich: #14251f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #9085e9;
  --pos: #3987e5; --neg: #e66767; --mitte-grau: #383835;
  --warnung-weich: #2a2113; --kritisch-weich: #2c1615; --schatten: none;
}
* { box-sizing: border-box; min-width: 0; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--flaeche); color: var(--ton-1);
  font: 400 var(--t-ui)/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.zahl { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -0.01em; }
b { font-weight: 600; }
code { font-family: ui-monospace, Menlo, monospace; font-size: var(--t-klein); background: var(--karte-tief);
  border: 1px solid var(--linie); border-radius: 4px; padding: 1px 5px; }

.kopf { position: sticky; top: 0; z-index: 20; background: var(--karte); border-bottom: 1px solid var(--linie);
  padding: 11px 28px 0; }
.steuer { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.steuer label { display: flex; align-items: center; gap: 7px; color: var(--ton-3); font-size: var(--t-klein); }
select, input { font: inherit; font-size: var(--t-text); color: var(--ton-1); background: var(--karte);
  border: 1px solid var(--linie); border-radius: var(--radius-s); padding: 5px 8px; }
input[type=number] { width: 78px; }
.leise { font: inherit; font-size: var(--t-text); color: var(--ton-2); background: var(--karte);
  border: 1px solid var(--linie); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
.leise:hover { border-color: var(--linie-stark); color: var(--ton-1); }
.stand { margin-left: auto; color: var(--ton-3); font-size: var(--t-klein); }
.unterreiter { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; }
.unterreiter button { border: 0; background: none; font: inherit; font-size: var(--t-text); color: var(--ton-2);
  flex: none; padding: 8px 12px 9px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.unterreiter button:hover { color: var(--ton-1); }
.unterreiter button[aria-selected="true"] { color: var(--ton-1); font-weight: 600; border-bottom-color: var(--akzent); }
.unterreiter button small { color: var(--ton-3); font-weight: 400; margin-right: 5px; }

main { max-width: 1240px; margin: 0 auto; padding: 22px 28px 80px; }
h2 { font-size: var(--t-mikro); margin: 0; font-weight: 600; color: var(--ton-2); text-transform: uppercase; letter-spacing: 0.09em; white-space: nowrap; }
.rubrik { display: flex; gap: 12px; align-items: center; margin: 28px 0 10px; }
.rubrik:first-child { margin-top: 0; }
.rubrik::after { content: ""; flex: 1; height: 1px; background: var(--linie); min-width: 20px; }
.rubrik > .rechts { order: 2; flex: none; color: var(--ton-3); font-size: var(--t-klein); }
.erklaerung { color: var(--ton-2); font-size: var(--t-text); max-width: 860px; margin: 0 0 14px; }
.fussnote { color: var(--ton-3); font-size: var(--t-klein); margin-top: 10px; max-width: 900px; }
.karte { background: var(--karte); border: 1px solid var(--linie); border-radius: var(--radius); box-shadow: var(--schatten); }
.kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.kachel { padding: 13px 16px; }
.kachel .titel { color: var(--ton-3); font-size: var(--t-mikro); text-transform: uppercase; letter-spacing: 0.07em; }
.kachel .wert { font-size: var(--t-wert); font-weight: 600; margin-top: 2px; line-height: 1.25; }
.kachel .neben { color: var(--ton-3); font-size: var(--t-klein); }
.zwei { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .zwei { grid-template-columns: 1fr; } }
.diagramm { padding: 14px 16px 10px; position: relative; }
.diagramm .dtitel { font-size: var(--t-text); font-weight: 600; }
.diagramm .dneben { color: var(--ton-3); font-size: var(--t-klein); margin-bottom: 6px; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--t-klein); color: var(--ton-2); margin: 2px 0 4px; }
.legende span::before { content: ""; display: inline-block; width: 12px; height: 3px; border-radius: 2px;
  background: var(--f); vertical-align: middle; margin-right: 6px; }
.legende span.strich::before { background: repeating-linear-gradient(90deg, var(--f) 0 4px, transparent 4px 7px); }
svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
svg.chart text { font-size: 10.5px; fill: var(--ton-3); font-family: ui-monospace, Menlo, monospace; }
.tip { position: absolute; pointer-events: none; z-index: 5; background: var(--karte); border: 1px solid var(--linie-stark);
  border-radius: var(--radius-s); padding: 6px 9px; font-size: var(--t-klein); box-shadow: 0 4px 14px rgb(0 0 0 / .12);
  white-space: nowrap; display: none; }
.tip .z { color: var(--ton-3); margin-bottom: 2px; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--f); margin-right: 6px; }
.rahmen { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: var(--t-text); }
th { text-align: left; color: var(--ton-3); font-weight: 500; font-size: var(--t-mikro); text-transform: uppercase;
  letter-spacing: 0.06em; padding: 9px 12px; border-bottom: 1px solid var(--linie); white-space: nowrap; }
td { padding: 7px 12px; border-bottom: 1px solid var(--linie); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.marke { display: inline-block; font-size: var(--t-mikro); border-radius: 999px; padding: 1px 8px; border: 1px solid var(--linie); color: var(--ton-2); }
.marke.warn { background: var(--warnung-weich); border-color: transparent; color: var(--ton-1); }
.marke.krit { background: var(--kritisch-weich); border-color: transparent; color: var(--ton-1); }
.leer { padding: 40px 28px; text-align: center; color: var(--ton-2); }
.karte.leer:not(:has(h3)) { padding: 14px 18px; text-align: left; color: var(--ton-3); font-size: var(--t-text); }
.leer h3 { margin: 0 0 6px; font-size: var(--t-zahl); color: var(--ton-1); }
.balken { display: grid; grid-template-columns: 110px 1fr 60px; align-items: center; gap: 10px; font-size: var(--t-text); padding: 4px 0; }
.balken .spur { height: 10px; background: var(--karte-tief); border-radius: 4px; overflow: hidden; display: flex; gap: 2px; }
.balken .spur div { height: 100%; border-radius: 0 4px 4px 0; background: var(--f); }
.params { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 16px; margin-bottom: 12px; }
.params label { display: flex; align-items: center; gap: 7px; font-size: var(--t-klein); color: var(--ton-2); }
.ki-fragen { order: 3; flex: none; margin-left: 4px; border: 1px solid var(--linie); background: var(--karte); color: var(--ton-3); border-radius: 999px; font: inherit; font-size: var(--t-mikro); padding: 2px 9px; cursor: pointer; }
.ki-fragen:hover { color: var(--akzent); border-color: var(--akzent); }
.ki-hervor { outline: 2px solid var(--akzent) !important; outline-offset: 3px; border-radius: var(--radius); animation: ki-hervor 1.2s ease-in-out 3; }
@keyframes ki-hervor { 50% { outline-color: transparent; } }
details.code { margin-top: 10px; } details.code summary { cursor: pointer; color: var(--ton-3); font-size: var(--t-klein); }
details.code pre, pre.code { font-family: ui-monospace, Menlo, monospace; font-size: var(--t-klein); background: var(--karte-tief); border: 1px solid var(--linie); border-radius: var(--radius-s); padding: 10px 12px; overflow-x: auto; white-space: pre; margin: 6px 0 0; line-height: 1.45; }
.notiz { padding: 14px 18px; font-size: var(--t-text); line-height: 1.55; } .notiz p { margin: 0 0 8px; } .notiz p:last-child { margin: 0; } .notiz ul { margin: 2px 0 8px; padding-left: 18px; }
.notiz .wann { color: var(--ton-3); font-size: var(--t-klein); margin-bottom: 6px; }
.werkstatt .diagramm { padding-left: 0; padding-right: 0; }
.unterreiter .trenner { flex: none; width: 1px; background: var(--linie); margin: 8px 8px; }
/* Erklärungen eingeklappt, aufklappbar über „Was heißt das?“ an der Rubrik */
.erkl-knopf { order: 3; flex: none; border: 0; background: none; color: var(--ton-3); font: inherit; font-size: var(--t-mikro); cursor: pointer; padding: 2px 4px; }
.erkl-knopf:hover { color: var(--akzent); }
body:not(.erkl-offen) .erklaerung.klappbar:not(.offen) { display: none; }
.erklaerung.klappbar { background: var(--karte-tief); border-left: 2px solid var(--akzent); border-radius: 0 var(--radius-s) var(--radius-s) 0; padding: 8px 12px; max-width: none; }
.sprung { position: sticky; top: var(--kopf-h, 96px); z-index: 10; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 10px; margin: -6px 0 6px; background: var(--flaeche); }
.sprung button { font: inherit; font-size: var(--t-klein); color: var(--ton-2); background: var(--karte); border: 1px solid var(--linie); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.sprung button:hover { color: var(--ton-1); border-color: var(--linie-stark); }
.datenlage { display: inline-flex; align-items: center; gap: 7px; }
.datenlage i { width: 8px; height: 8px; border-radius: 50%; background: var(--ton-3); flex: none; }
.datenlage i.gut { background: var(--gut); } .datenlage i.warn { background: var(--warnung); } .datenlage i.krit { background: var(--kritisch); }
.hinweisband { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; margin-bottom: 14px; font-size: var(--t-text); color: var(--ton-2); }
.hinweisband b { color: var(--ton-1); }
.ps-eingabe textarea, .ps-script { width: 100%; font: inherit; font-size: var(--t-text); color: var(--ton-1); background: var(--karte-tief); border: 1px solid var(--linie); border-radius: var(--radius-s); padding: 10px 12px; resize: vertical; }
.ps-script { font-family: ui-monospace, Menlo, monospace; font-size: var(--t-klein); line-height: 1.5; min-height: 120px; }
.ps-eingabe textarea:focus, .ps-script:focus { outline: none; border-color: var(--akzent); }
.ps-zeile { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 10px; }
.ps-chip { font: inherit; font-size: var(--t-klein); color: var(--ton-2); background: var(--karte); border: 1px solid var(--linie); border-radius: 999px; padding: 4px 11px; cursor: pointer; text-align: left; }
.ps-chip:hover { border-color: var(--akzent); color: var(--ton-1); }
.ps-wert { display: inline-flex; align-items: center; gap: 5px; font-size: var(--t-klein); color: var(--ton-2); }
.ps-wert input { accent-color: var(--akzent); }
.ps-haupt { font: inherit; font-size: var(--t-text); font-weight: 600; color: var(--karte); background: var(--akzent); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; }
.ps-haupt[disabled] { opacity: .5; cursor: default; }
.ps-karte { padding: 16px 18px; margin-bottom: 12px; }
.ps-karte h3 { margin: 0 0 6px; font-size: var(--t-kopf, 15px); }
.ps-karte ul { margin: 6px 0 0; padding-left: 18px; color: var(--ton-2); font-size: var(--t-text); }
.ps-param input { width: 72px; }
.urteil { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: var(--t-zahl); }
.urteil i { width: 10px; height: 10px; border-radius: 50%; background: var(--ton-3); }
.urteil.haelt i { background: var(--gut); } .urteil.wackelt i, .urteil.zu_wenig i { background: var(--warnung); } .urteil.bricht i, .urteil.schwach i { background: var(--kritisch); }
.ps-claude { white-space: pre-line; margin-top: 10px; background: var(--karte-tief); border-left: 3px solid var(--akzent); border-radius: 0 var(--radius-s) var(--radius-s) 0; padding: 10px 14px; font-size: var(--t-text); line-height: 1.55; }

/* Startseite Charts */
.cw { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(280px, 1fr); margin-bottom: 14px; overflow: hidden; }
.cw-chart { padding: 14px 10px 10px 16px; border-right: 1px solid var(--linie); min-width: 0; background: #15171c; color: #e7e9ee; }
.cw-chart .cw-kopf .sym, .cw-chart .cw-kopf .nr { color: #8b93a1; }
.cw-chart .pos { color: #3ddc97; } .cw-chart .neg { color: #ff6b7a; }
.lw { position: relative; width: 100%; border-radius: 6px; overflow: hidden; background: #15171c; }
.lw-hinweis { position: absolute; left: 10px; bottom: 30px; z-index: 3; font: 10.5px ui-monospace, Menlo, monospace; color: #8b93a1; pointer-events: none; }
.karte.diagramm .lw { margin-top: 6px; }
.cw-kopf { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 2px; }
.cw-kopf .nr { color: var(--ton-3); font-size: var(--t-klein); font-variant-numeric: tabular-nums; }
.cw-kopf h3 { margin: 0; font-size: var(--t-zahl); font-weight: 600; }
.cw-kopf .sym { color: var(--ton-3); font-size: var(--t-klein); }
.cw-kopf .kurs { margin-left: auto; font-size: var(--t-zahl); font-weight: 600; }
.cw-kopf .ver { font-size: var(--t-klein); }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.auff { display: flex; align-items: center; gap: 8px; font-size: var(--t-klein); color: var(--ton-3); }
.auff .spur { flex: 1; height: 6px; border-radius: 3px; background: var(--karte-tief); overflow: hidden; }
.auff .spur div { height: 100%; background: var(--akzent); border-radius: 3px; }
.cw-seite { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; height: var(--cw-h, 520px); }
.cw-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-mikro); color: var(--ton-2); background: var(--karte-tief); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.pill b { color: var(--ton-1); font-variant-numeric: tabular-nums; }
.pill .mini { width: 34px; height: 4px; border-radius: 2px; background: var(--linie); overflow: hidden; } .pill .mini i { display: block; height: 100%; background: var(--akzent); }
.pill.gut { background: var(--akzent-weich); color: var(--ton-1); } .pill.schwach { background: var(--warnung-weich); color: var(--ton-1); }
.claude-text { flex: none; font-size: var(--t-text); line-height: 1.5; background: var(--karte-tief); border-radius: var(--radius-s); padding: 9px 12px 7px; }
.claude-text .wer { color: var(--ton-3); font-size: var(--t-mikro); margin-bottom: 3px; display: flex; gap: 6px; }
.claude-text .inhalt { max-height: 3.9em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 62%, transparent); mask-image: linear-gradient(#000 62%, transparent); }
.claude-text.offen .inhalt { max-height: none; -webkit-mask-image: none; mask-image: none; }
.claude-text .mehr { border: 0; background: none; padding: 2px 0 0; font: inherit; font-size: var(--t-mikro); color: var(--akzent); cursor: pointer; }
.claude-text.leer { color: var(--ton-3); }
.seg { display: flex; gap: 2px; background: var(--karte-tief); border-radius: 8px; padding: 2px; flex: none; }
.seg button { flex: 1; border: 0; background: none; border-radius: 6px; padding: 5px 6px; font: inherit; font-size: var(--t-klein); color: var(--ton-2); cursor: pointer; white-space: nowrap; }
.seg button[aria-selected="true"] { background: var(--karte); color: var(--ton-1); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .15); }
.seg button small { color: var(--ton-3); font-weight: 400; margin-left: 3px; }
.reiterinhalt { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
.zeile { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; column-gap: 9px; align-items: center; padding: 7px 6px; border-radius: var(--radius-s); }
.zeile + .zeile { border-top: 1px solid var(--linie); }
.zeile.klick { cursor: pointer; } .zeile.klick:hover, .zeile.an { background: var(--karte-tief); }
.zeile > i { width: 9px; height: 9px; border-radius: 50%; }
.zeile .titel { font-size: var(--t-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zeile .unter { grid-column: 2 / 4; color: var(--ton-3); font-size: var(--t-mikro); margin-top: 1px; }
.zeile .rechts { font-size: var(--t-mikro); color: var(--ton-2); white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.guete { font-variant-numeric: tabular-nums; color: var(--ton-1); background: var(--karte-tief); border-radius: 4px; padding: 0 5px; }
.zeile.an .guete { background: var(--karte); }
.richtung { font-weight: 600; } .richtung.bullisch { color: var(--pos); } .richtung.baerisch { color: var(--neg); } .richtung.neutral { color: var(--ton-3); }
.frisch { color: var(--akzent); font-weight: 600; }
.vorschlaege { display: flex; flex-direction: column; gap: 5px; }
.vorschlag { display: flex; align-items: center; gap: 8px; text-align: left; font: inherit; font-size: var(--t-klein); color: var(--ton-2); background: var(--karte); border: 1px solid var(--linie); border-radius: var(--radius-s); padding: 6px 9px; cursor: pointer; }
.vorschlag:hover { border-color: var(--akzent); color: var(--ton-1); }
.vorschlag.empf { border-color: var(--akzent); background: var(--akzent-weich); color: var(--ton-1); }
.vorschlag .plus { color: var(--akzent); font-weight: 600; }
.vorschlag.ok { border-color: transparent; background: var(--karte-tief); color: var(--ton-3); cursor: default; }
.vorschlag small { margin-left: auto; color: var(--akzent); white-space: nowrap; }
.cw-fuss { display: flex; gap: 6px; flex-wrap: wrap; flex: none; padding-top: 8px; border-top: 1px solid var(--linie); }
.cw-fuss .leise { padding: 5px 11px; font-size: var(--t-klein); }
.cw-bild { position: relative; }
.vollknopf { position: absolute; left: 8px; top: 8px; z-index: 4; border: 1px solid #343a45; background: rgba(27,30,36,.9); color: #c9ced8; border-radius: 7px; font: 12px/1 ui-monospace, Menlo, monospace; padding: 5px 8px; cursor: pointer; }
.vollknopf:hover { color: #fff; border-color: #f5b942; }
.vollbild { position: fixed; inset: 0; z-index: 200; background: #111317; display: flex; flex-direction: column; color: #e7e9ee; }
.vollbild .vb-kopf { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid #272b33; background: linear-gradient(180deg,#1d2026,#171a1f); }
.vollbild .vb-kopf h3 { margin: 0; font-size: 15px; } .vollbild .vb-kopf .sym { color: #8b93a1; font-size: 12px; }

/* ===== Finanz-Design (21.10.2026), wie im Dashboard: ruhige Karten, neutrale Flächen, Grün nur als Akzent.
   Überschreibt Tokens und Formen von oben; Inhalte und Funktionen bleiben unverändert. ===== */
:root { --radius: 14px; --radius-s: 9px; --glow: transparent; --rand: 1px solid var(--linie); --auf-akzent: #fff;
  --schatten: 0 1px 2px rgb(0 0 0 / .04), 0 4px 14px rgb(20 30 25 / .05); }
@media (prefers-color-scheme: dark) { :root:not([data-thema="hell"]) { --flaeche: #08090a; --karte: #101213; --karte-tief: #16191a; --linie: #1e2223; --linie-stark: #2b3031; --gitter: #191c1d; --ton-2: #b6bcbb; --ton-3: #7a8180; --akzent-weich: rgb(79 199 154 / .08); --glow: rgb(79 199 154 / .05); --gut: #2fcf7a; --kritisch: #f05454; --kritisch-weich: rgb(208 59 59 / .17); --schatten: 0 8px 24px rgb(0 0 0 / .35); --rand: 1px solid rgb(255 255 255 / .055); --auf-akzent: #04140d; } }
:root[data-thema="dunkel"] { --flaeche: #08090a; --karte: #101213; --karte-tief: #16191a; --linie: #1e2223; --linie-stark: #2b3031; --gitter: #191c1d; --ton-2: #b6bcbb; --ton-3: #7a8180; --akzent-weich: rgb(79 199 154 / .08); --glow: rgb(79 199 154 / .05); --gut: #2fcf7a; --kritisch: #f05454; --kritisch-weich: rgb(208 59 59 / .17); --schatten: 0 8px 24px rgb(0 0 0 / .35); --rand: 1px solid rgb(255 255 255 / .055); --auf-akzent: #04140d; }
body { background: radial-gradient(1000px 420px at 60% -12%, var(--glow), transparent 70%), var(--flaeche); background-attachment: fixed; }
.zahl { font-family: inherit; letter-spacing: -.005em; }
.kopf { background: color-mix(in srgb, var(--flaeche) 94%, transparent); backdrop-filter: blur(12px); padding: 12px 28px 10px; }

.unterreiter { gap: 4px; }

/* Chartflächen bleiben dunkel wie in iC Charts, jetzt im selben Ton wie die Karten */

/* Chartkarten (21.10.2026): Kennzahlenleiste, Formationszeilen mit Güte und Status, Einordnung als Textband */
.kz { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--karte-tief); border-radius: var(--radius-s); flex: none; }
.kz > div { padding: 8px 12px; border-right: 1px solid var(--linie); display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.kz > div:last-child { border-right: 0; }
.kz .beschriftung { font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kz b { font-size: 17px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
.kz b.gut { color: var(--gut); } .kz b.schwach { color: var(--warnung); }
.kz-spur { height: 4px; border-radius: 2px; background: var(--linie); overflow: hidden; margin-top: 3px; }
.kz-spur i { display: block; height: 100%; background: var(--akzent); }
.claude-text { border-left: 3px solid var(--akzent); border-radius: 0 var(--radius-s) var(--radius-s) 0; }
.fz { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto auto; column-gap: 10px; align-items: center; padding: 8px 8px; border-radius: var(--radius-s); }

.fz-name small { display: block; font-weight: 400; color: var(--ton-3); font-size: var(--t-mikro); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.fz.an .fz-name, .fz.an .fz-name small { white-space: normal; }
.fz-guete { display: inline-flex; align-items: center; gap: 6px; }
.fz-guete > span { width: 34px; height: 4px; border-radius: 2px; background: var(--linie); overflow: hidden; }
.fz-guete > span i { display: block; height: 100%; background: var(--ton-2); }

.fz-wert { font-size: var(--t-klein); color: var(--ton-2); }
.spille { font-size: var(--t-mikro); padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--linie); color: var(--ton-2); }
.spille.ereignis { background: var(--akzent-weich); border-color: color-mix(in srgb, var(--akzent) 40%, transparent); color: var(--ton-1); }
.spille.bildet { border-style: dashed; color: var(--ton-3); }

.cw-seite.v1 { gap: 12px; }
.reiterleiste { display: flex; gap: 18px; border-bottom: 1px solid var(--linie); flex: none; }
.reiterleiste button { border: 0; background: none; font: inherit; font-size: var(--t-text); color: var(--ton-3); padding: 2px 0 8px; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
.reiterleiste button[aria-selected="true"] { color: var(--ton-1); font-weight: 600; border-bottom-color: var(--akzent); }
.reiterleiste small { color: var(--ton-3); font-weight: 400; }

/* Kopf mit Wert und Kurs ganz oben, darunter die Einordnung */
.cw-titel { grid-column: 1 / -1; padding: 16px 22px 0; }
.cw-titel .cw-kopf { margin: 0; }
.cw-titel .cw-kopf h3 { font-size: 19px; letter-spacing: -.01em; }
.cw-titel .cw-kopf .kurs { font-size: 19px; }
.cw-titel .pos { color: var(--gut); } .cw-titel .neg { color: var(--kritisch); }
.cw-einordnung { grid-column: 1 / -1; padding: 10px 22px 14px; border-bottom: 1px solid var(--linie); }
.eo-kopf { display: flex; gap: 10px; align-items: baseline; margin-bottom: 5px; font-size: var(--t-klein); }
.eo-marke { color: var(--akzent); font-weight: 600; font-size: var(--t-klein); }
.eo-zeit { color: var(--ton-3); font-size: var(--t-klein); }
.eo-text { font-size: 13.5px; line-height: 1.6; color: var(--ton-1); max-height: 3.2em; overflow: hidden; max-width: 150ch;
  -webkit-mask-image: linear-gradient(#000 50%, transparent); mask-image: linear-gradient(#000 50%, transparent); }
.cw-einordnung.offen .eo-text, .cw-einordnung.passt .eo-text { max-height: none; -webkit-mask-image: none; mask-image: none; }
.eo-mehr { border: 0; background: none; padding: 3px 0 0; font: inherit; font-size: var(--t-klein); font-weight: 600; color: var(--akzent); cursor: pointer; }
.eo-mehr:hover { text-decoration: underline; }
.eo-mehr[hidden] { display: none; }

/* ===== Blau-Design (21.10.2026) wie im Dashboard: Grün und Rot nur für Kurse, sonst kühles Blau, Glas-Karten ===== */
:root { --akzent: #1d6fb8; --akzent-weich: #e6f1fa; --auf-akzent: #fff; --glow: rgb(29 111 184 / .06); }
@media (prefers-color-scheme: dark) { :root:not([data-thema="hell"]) {
  --akzent: #48a6f2; --akzent-2: #5fd4e8; --akzent-weich: rgb(72 166 242 / .09); --auf-akzent: #fff;
  --flaeche: #06080c; --karte: rgb(16 20 27 / .78); --karte-tief: #141a24; --linie: rgb(255 255 255 / .06); --linie-stark: rgb(255 255 255 / .11); --gitter: #161c25;
  --glow: rgb(72 166 242 / .12); --glow-2: rgb(95 212 232 / .05); --radius: 18px;
  --schatten: inset 0 1px 0 rgb(255 255 255 / .045), 0 12px 32px rgb(0 0 0 / .42); --rand: 1px solid rgb(255 255 255 / .065); } }
:root[data-thema="dunkel"] {
  --akzent: #48a6f2; --akzent-2: #5fd4e8; --akzent-weich: rgb(72 166 242 / .09); --auf-akzent: #fff;
  --flaeche: #06080c; --karte: rgb(16 20 27 / .78); --karte-tief: #141a24; --linie: rgb(255 255 255 / .06); --linie-stark: rgb(255 255 255 / .11); --gitter: #161c25;
  --glow: rgb(72 166 242 / .12); --glow-2: rgb(95 212 232 / .05); --radius: 18px;
  --schatten: inset 0 1px 0 rgb(255 255 255 / .045), 0 12px 32px rgb(0 0 0 / .42); --rand: 1px solid rgb(255 255 255 / .065); }
body { background: radial-gradient(900px 520px at 72% -8%, var(--glow), transparent 70%),
  radial-gradient(700px 600px at 8% 105%, var(--glow-2, transparent), transparent 70%), var(--flaeche); background-attachment: fixed; }
.karte { background: linear-gradient(180deg, rgb(255 255 255 / .03), rgb(255 255 255 / 0) 46%), var(--karte); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
:root[data-thema="hell"] .karte { backdrop-filter: none; }
.kopf { background: rgb(6 8 12 / .6); backdrop-filter: blur(18px) saturate(1.2); border-bottom: 1px solid rgb(255 255 255 / .05); }
:root[data-thema="hell"] .kopf { background: color-mix(in srgb, var(--flaeche) 90%, transparent); }
.leise, .sprung button { background: rgb(255 255 255 / .035); border-color: rgb(255 255 255 / .08); border-radius: 12px; }
:root[data-thema="hell"] .leise, :root[data-thema="hell"] .sprung button { background: var(--karte-tief); border-color: var(--linie); }
.unterreiter button[aria-selected="true"] { background: color-mix(in srgb, var(--akzent) 13%, var(--karte-tief));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--akzent) 22%, transparent), inset 0 -2px 0 var(--akzent); }
.seg button[aria-selected="true"] { background: color-mix(in srgb, var(--akzent) 13%, var(--karte-tief)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--akzent) 22%, transparent); }
.pill.gut { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--akzent) 40%, transparent); }
select:focus, input:focus { outline: none; border-color: var(--akzent); box-shadow: 0 0 0 3px var(--akzent-weich); }
.cw-chart, .lw { background: #0e1218; }
/* Reiter: ausgeblendete aus, Alarme hervorgehoben (Bernstein = Signal, nicht Kursrichtung) */
.unterreiter button[hidden] { display: none; }
.unterreiter .reiter-alarm { display: inline-flex; align-items: center; gap: 7px; color: var(--ton-1);
  border: 1px solid color-mix(in srgb, var(--warnung) 32%, transparent); background: color-mix(in srgb, var(--warnung) 7%, transparent); }
.unterreiter .reiter-alarm:hover { background: color-mix(in srgb, var(--warnung) 13%, transparent); }
.reiter-alarm svg { width: 14px; height: 14px; fill: none; stroke: var(--warnung); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.unterreiter .reiter-alarm[aria-selected="true"] { background: color-mix(in srgb, var(--warnung) 15%, var(--karte-tief));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warnung) 45%, transparent), inset 0 -2px 0 var(--warnung); }
.alarm-zahl { min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: var(--warnung); color: #1a1405;
  font-size: 10.5px; font-weight: 700; display: inline-grid; place-items: center; }
.alarm-zahl[hidden] { display: none; }
.alarm-zahl.frisch { animation: alarm-puls 1.8s ease-in-out infinite; }
@keyframes alarm-puls { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--warnung) 25%, transparent); } }
/* Farblogik (21.10.2026): positiv/bullisch grün, negativ/bärisch rot, alles andere blau.
   Die alten Marken aus dem Portfolio-Agent-Stil hatten Blau für positiv (--pos) und Blau/Orange für die Richtung. */
:root, :root:not([data-thema="hell"]), :root[data-thema="dunkel"] { --pos: var(--gut); --neg: var(--kritisch); --serie: var(--akzent); }
.pill.gut { background: var(--gut-weich, color-mix(in srgb, var(--gut) 14%, transparent)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gut) 40%, transparent); color: var(--ton-1); }
.datenlage i.gut { background: var(--akzent); }

/* ===== Ideen-Labor (21.10.2026, fürs Video): Kopf, Eingabe wie ein KI-Chat, Studien-Karten, großes Urteil ===== */
.lab-held { position: relative; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px 36px; align-items: center; margin: 8px 0 18px;
  padding: 28px 30px 22px; border-radius: 22px; border: 1px solid rgb(255 255 255 / .07); overflow: hidden;
  background: radial-gradient(520px 260px at 100% 0%, color-mix(in srgb, var(--akzent) 18%, transparent), transparent 70%),
    radial-gradient(420px 220px at 0% 100%, rgb(95 212 232 / .07), transparent 70%), linear-gradient(180deg, rgb(255 255 255 / .03), transparent 60%), var(--karte);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .05), 0 18px 40px rgb(0 0 0 / .35); }
.lab-held::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .35;
  background-image: radial-gradient(rgb(255 255 255 / .08) 1px, transparent 1.2px); background-size: 10px 10px;
  -webkit-mask-image: linear-gradient(230deg, #000, transparent 45%); mask-image: linear-gradient(230deg, #000, transparent 45%); }
.lab-marke { color: var(--akzent); font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.lab-held h1 { margin: 8px 0 10px; font-size: 32px; line-height: 1.12; letter-spacing: -.025em; font-weight: 700; color: var(--ton-1); }
.lab-held h1 span { background: linear-gradient(90deg, #8ccaf7, var(--akzent) 55%, #5fd4e8); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lab-held p { margin: 0; color: var(--ton-2); font-size: 14px; line-height: 1.6; max-width: 56ch; }
.lab-schritte { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; position: relative; z-index: 1; }
.lab-schritte li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: rgb(255 255 255 / .03); border: 1px solid rgb(255 255 255 / .07); }
.lab-schritte li b { width: 28px; height: 28px; flex: none; border-radius: 9px; display: grid; place-items: center; font-size: 13px; color: var(--akzent);
  background: color-mix(in srgb, var(--akzent) 14%, transparent); border: 1px solid color-mix(in srgb, var(--akzent) 30%, transparent); }
.lab-schritte li span { display: flex; flex-direction: column; font-size: 12px; color: var(--ton-3); }
.lab-schritte li strong { font-size: 13.5px; color: var(--ton-1); font-weight: 600; }
.lab-schritte li.an { border-color: color-mix(in srgb, var(--akzent) 45%, transparent); background: color-mix(in srgb, var(--akzent) 9%, transparent); }
.lab-schritte li.an b { color: #fff; background: linear-gradient(135deg, #63bdf7, #2a83d6); box-shadow: 0 0 14px color-mix(in srgb, var(--akzent) 45%, transparent); animation: lab-puls 1.6s ease-in-out infinite; }
.lab-schritte li.fertig b { color: var(--akzent); }
@keyframes lab-puls { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--akzent) 16%, transparent); } }
.lab-split { grid-column: 1 / -1; display: flex; gap: 4px; position: relative; z-index: 1; }
.lab-split > div { display: flex; flex-direction: column; gap: 2px; padding: 9px 14px; border-radius: 12px; min-width: 0; }
.lab-split .lern { flex: 7; background: color-mix(in srgb, var(--akzent) 13%, transparent); border: 1px solid color-mix(in srgb, var(--akzent) 30%, transparent); }
.lab-split .pruef { flex: 3; background: repeating-linear-gradient(135deg, rgb(245 185 66 / .07) 0 8px, rgb(245 185 66 / .02) 8px 16px); border: 1px dashed rgb(245 185 66 / .45); }
.lab-split .pruef.offen { background: rgb(245 185 66 / .09); border-style: solid; }
.lab-split span { font-size: 12.5px; font-weight: 600; color: var(--ton-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lab-split small { font-size: 11.5px; color: var(--ton-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lab-regeln { grid-column: 1 / -1; position: relative; z-index: 1; font-size: 12.5px; color: var(--ton-3); }
.lab-regeln summary { cursor: pointer; width: max-content; color: var(--ton-2); }
.lab-regeln summary:hover { color: var(--akzent); }
.lab-regeln p { margin: 8px 0 0; line-height: 1.6; max-width: 110ch; color: var(--ton-2); }

.lab-eingabe, .lab-verstanden, .lab-script, .lab-pruefen, .lab-kopf, .lab-ergebnis, .lab-warten { padding: 20px 22px; margin-bottom: 14px; border-radius: 18px; }
.lab-eingabe-kopf { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.lab-eingabe-kopf h3 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
.lab-stern { width: 30px; height: 30px; flex: none; border-radius: 10px; display: grid; place-items: center; color: #fff; font-size: 14px;
  background: linear-gradient(135deg, #63bdf7, #2a83d6); box-shadow: inset 0 1px 0 rgb(255 255 255 / .25), 0 4px 12px color-mix(in srgb, var(--akzent) 28%, transparent); }
.lab-code-ikon { width: 30px; height: 30px; flex: none; border-radius: 10px; display: grid; place-items: center; font: 600 11px ui-monospace, Menlo, monospace; color: var(--akzent);
  background: color-mix(in srgb, var(--akzent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--akzent) 28%, transparent); }
.lab-hinweis { margin-left: auto; font-size: 12px; color: var(--ton-3); }
.lab-eingabe textarea { width: 100%; box-sizing: border-box; min-height: 92px; resize: vertical; font: inherit; font-size: 15px; line-height: 1.55; color: var(--ton-1);
  background: rgb(255 255 255 / .035); border: 1px solid rgb(255 255 255 / .09); border-radius: 14px; padding: 14px 16px; transition: border-color .2s, box-shadow .2s; }
.lab-eingabe textarea:focus, .lab-script .ps-script:focus { outline: none; border-color: color-mix(in srgb, var(--akzent) 60%, transparent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--akzent) 12%, transparent), 0 0 24px color-mix(in srgb, var(--akzent) 10%, transparent); }
.lab-label { margin: 16px 0 8px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ton-3); }
.lab-label small { text-transform: none; letter-spacing: 0; margin-left: 8px; font-size: 11.5px; }
.lab-label.warn { color: var(--warnung); }
.lab-beispiele { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.lab-bsp { display: flex; flex-direction: column; gap: 4px; text-align: left; font: inherit; cursor: pointer; padding: 11px 13px; border-radius: 13px; color: var(--ton-2);

/* Ideen-Labor, Kopf v2: eine Blickrichtung von oben nach unten – Titel, drei Schritte, Zeitachse */
.lab-held { display: flex; flex-direction: column; gap: 18px; align-items: stretch; padding: 26px 30px 20px; }

<script>
const $ = s => document.querySelector(s);
const F = (x, n = 1) => x == null ? "–" : Number(x).toLocaleString("de-DE", { minimumFractionDigits: n, maximumFractionDigits: n });
const EUR = x => x == null ? "–" : x >= 1e6 ? F(x / 1e6, 2) + " Mio. €" : x >= 1e4 ? F(x / 1e3, 0) + " Tsd. €" : F(x, 0) + " €";
const UHR = s => new Date(s * 1000).toLocaleTimeString("de-DE", { timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit" });
const UHRS = s => new Date(s * 1000).toLocaleTimeString("de-DE", { timeZone: "Europe/Berlin" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const farbe = n => `var(--s${n})`;
let UEB = null, DATEN = null, REITER = "claude", SPRUNG = null;
const BILD = new URLSearchParams(location.search).get("bild");   // Bildmodus für Telegram: nur ein Chart, vom Agenten fotografiert
// Alte Unterreiter (A bis F, Formationen) zeigen auf die neue Gliederung, mit Ziel innerhalb des Reiters
const ALT = { a: ["orderbuch", "Handelskosten"], b: ["orderbuch", "Ungleichgewicht"], c: ["orderbuch", "Wände"], d: ["handel", "Wo ist der Kurs"],
  e: ["handel", "Wer drängt"], auktionen: ["handel", "Auktionen"], f: ["strategien"], formationen: ["charts"] };
const REITER_ALLE = ["charts", "orderbuch", "handel", "strategien", "werkstatt", "pruefstein", "pruefstand", "alarme", "claude"];
function reiterSetzen(r) {
  if (ALT[r]) { SPRUNG = ALT[r][1] || null; r = ALT[r][0]; }
  REITER = REITER_ALLE.includes(r) ? r : "charts";
  try { localStorage.setItem("analysen-reiter", REITER); } catch (e) {}
}
// Ausgeblendete Reiter: beim Öffnen nicht dorthin zurückspringen (direkt per ?reiter= oder vom Agenten geht weiter)
const VERBORGEN = ["orderbuch", "handel", "strategien", "werkstatt"];
reiterSetzen("claude");                                                          // Analysen startet immer mit Claude (?reiter= geht vor)
reiterSetzen(new URLSearchParams(location.search).get("reiter") || REITER);

// --- Darstellung vom Dashboard übernehmen ---------------------------------------------
function thema(t) { if (!t || t === "system") document.documentElement.removeAttribute("data-thema"); else document.documentElement.setAttribute("data-thema", t); }
thema(new URLSearchParams(location.search).get("thema"));
// --- Steuerung aus dem Dashboard-Panel (Claude) per postMessage -----------------------
const ELTERN = () => (window.parent !== window ? window.parent : null);
const wertId = x => { const s = String(x || "").toUpperCase(); const w = (UEB ? UEB.werte : []).find(w => w.id === s || w.symbol === s); return w ? w.id : null; };
function kontextSenden() {
  if (!ELTERN()) return;
  const chart = REITER === "charts" && CH.detail;
  const w = chart ? (FZ.werte ? FZ.werte.werte.find(x => x.id === FZ.wert) : null) : ["charts", "alarme", "claude"].includes(REITER) ? null : (UEB ? UEB.werte.find(x => x.id === $("#wert").value) : null);
  ELTERN().postMessage({ typ: "kontext", reiter: REITER + (chart ? " (Detail)" : ""), wert: w ? { id: w.id, symbol: w.symbol, name: w.name } : null, tag: ["charts", "alarme", "claude"].includes(REITER) ? null : $("#tag").value,
    tf: chart ? FZ.tf : null, top_charts: REITER === "charts" && !chart && CH.daten ? CH.daten.werte.slice(0, 5).map(x => `${x.wert.symbol} ${x.tf} (${x.auffaelligkeit})`) : undefined, karten: [...document.querySelectorAll("#inhalt .rubrik h2, #inhalt .dtitel")].map(e => e.textContent.trim()).slice(0, 30), stand: $("#stand").textContent }, "*");
}
async function navigieren(d) {
  if (d.reiter) reiterSetzen(d.reiter);
  if (REITER === "charts") {
    if (d.wert) {
      if (!FZ.werte) FZ.werte = await (await fetch("api/werte")).json();
      const id = wertId(d.wert) || (FZ.werte.werte.find(w => w.symbol === String(d.wert).toUpperCase() || w.id === d.wert) || {}).id;
      if (id) { CH.detail = id; FZ.wert = id; if (d.tf && TFS.includes(d.tf)) FZ.tf = d.tf; else if (CH.daten) FZ.tf = (CH.daten.werte.find(x => x.wert.id === id) || {}).tf || FZ.tf; FZ.auswahl = null; merkenFZ(); }
    } else CH.detail = null;
    await zeichnen(); return { reiter: REITER, wert: CH.detail ? FZ.wert : null, tf: CH.detail ? FZ.tf : null };
  }
  if (REITER === "claude" || REITER === "alarme") { await zeichnen(); return { reiter: REITER }; }
  if (!UEB) await uebersicht();
  let neu = false;
  if (d.tag && UEB.tage.some(t => t.tag === d.tag) && $("#tag").value !== d.tag) { $("#tag").value = d.tag; werteFuellen($("#wert").value); neu = true; }
  if (d.wert) { const id = wertId(d.wert); if (id && [...$("#wert").options].some(o => o.value === id) && $("#wert").value !== id) { $("#wert").value = id; neu = true; } }
  if (neu || !DATEN) await laden(); else await zeichnen();
  return { reiter: REITER, wert: $("#wert").value, tag: $("#tag").value };
}
function hervorheben(titel) {
  const such = String(titel || "").toLowerCase().trim(); if (!such) return false;
  const el = [...document.querySelectorAll("#inhalt .rubrik h2, #inhalt .dtitel, #inhalt .kachel .titel, #inhalt th")].find(e => e.textContent.toLowerCase().includes(such));
  if (!el) return false;
  let ziel = el.closest(".karte") || el;
  const rub = el.closest(".rubrik");
  if (rub) { let n = rub.nextElementSibling; while (n && !n.classList.contains("rubrik") && !n.matches(".karte, .kacheln, .zwei, .rahmen, table")) n = n.nextElementSibling; ziel = n && !n.classList.contains("rubrik") ? n : (rub.nextElementSibling || rub); }   // erste Karte nach der Rubrik
  document.querySelectorAll(".ki-hervor").forEach(x => x.classList.remove("ki-hervor"));
  ziel.classList.add("ki-hervor"); ziel.scrollIntoView({ behavior: "smooth", block: "center" });
  setTimeout(() => ziel.classList.remove("ki-hervor"), 5000);
  return true;
}
addEventListener("message", async e => {
  const d = e.data || {};
  if (d.thema) thema(d.thema);
  if (!e.origin.endsWith(":" + ((+location.port || 8813) - 1)) && e.origin !== location.origin) return;          // Steuerung nur aus dem Dashboard
  if (d.typ === "navigieren") { try { const r = await navigieren(d); ELTERN().postMessage({ typ: "navigiert", id: d.id, ...r }, "*"); } catch (x) { ELTERN().postMessage({ typ: "navigiert", id: d.id, fehler: String(x) }, "*"); } }
  else if (d.typ === "hervorheben") ELTERN().postMessage({ typ: "hervorgehoben", id: d.id, gefunden: hervorheben(d.titel) }, "*");
  else if (d.typ === "kontext?") kontextSenden();

const TFS = ["1m", "5m", "15m", "1h", "1d"];

// --- Diagramme --------------------------------------------------------------------------
const tip = $("#tip");
function tipZeigen(ev, html) {
  tip.innerHTML = html; tip.style.display = "block";
  const b = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + b.width > innerWidth - 8) x = ev.clientX - b.width - 14;
  if (y + b.height > innerHeight - 8) y = ev.clientY - b.height - 14;
  tip.style.left = x + scrollX + "px"; tip.style.top = y + scrollY + "px";
}
const tipWeg = () => tip.style.display = "none";

// Diagramme in echter Pixelbreite zeichnen, damit Schrift und Linien nicht mitskalieren
const breite = el => Math.max(300, Math.round(el.clientWidth - 32)) || 640;
let umbruch, zuletztBreite = innerWidth;

function skala(lo, hi, n = 4) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const roh = (hi - lo) / n, p = Math.pow(10, Math.floor(Math.log10(roh)));
  const schritt = [1, 2, 2.5, 5, 10].map(f => f * p).find(s => s >= roh);
  const a = Math.floor(lo / schritt) * schritt, b = Math.ceil(hi / schritt) * schritt;
  const ticks = []; for (let v = a; v <= b + schritt / 2; v += schritt) ticks.push(+v.toFixed(10));
  return { lo: a, hi: b, ticks };
}

function legende(serien) {
  if (serien.length < 2) return "";
  return `<div class="legende">${serien.map(s => `<span class="${s.strich ? "strich" : ""}" style="--f:${s.farbe}">${esc(s.name)}</span>`).join("")}</div>`;
}

// Linien über der Zeit, ein gemeinsames Fadenkreuz mit allen Reihen
function linie(el, { t, serien, fmt = v => F(v, 1), einheit = "", null: nullLinie = false, hoehe = 200, xfmt = UHR, extra }) {
  const B = breite(el), H = hoehe, L = 48, R = 10, O = 10, U = 22;
  const alle = serien.flatMap(s => s.werte).filter(v => v != null && isFinite(v));
  if (!t.length || !alle.length) { el.innerHTML += `<div class="dneben">keine Daten</div>`; return; }
  let lo = Math.min(...alle), hi = Math.max(...alle);
  if (nullLinie) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const y = skala(lo, hi), x0 = t[0], x1 = t[t.length - 1] || x0 + 1;
  if (xfmt === UHR && x1 - x0 < 600) xfmt = UHRS;                       // kurze Spannen mit Sekunden
  const X = v => L + (v - x0) / ((x1 - x0) || 1) * (B - L - R), Y = v => O + (1 - (v - y.lo) / (y.hi - y.lo)) * (H - O - U);
  let svg = `<svg class="chart" viewBox="0 0 ${B} ${H}" role="img">`;
  for (const v of y.ticks) svg += `<line x1="${L}" x2="${B - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--gitter)"/><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${fmt(v)}</text>`;
  if (nullLinie && y.lo < 0) svg += `<line x1="${L}" x2="${B - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--linie-stark)"/>`;
  const nx = Math.min(6, t.length);
  for (let i = 0; i < nx; i++) { const v = x0 + (x1 - x0) * i / Math.max(1, nx - 1); svg += `<text x="${X(v)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === nx - 1 ? "end" : "middle"}">${xfmt(v)}</text>`; }
  if (extra) svg += extra(X, Y);
  for (const s of serien) {
    let d = "", auf = false;
    s.werte.forEach((v, i) => { if (v == null || !isFinite(v)) { auf = false; return; } d += (auf ? "L" : "M") + X(t[i]).toFixed(1) + "," + Y(v).toFixed(1); auf = true; });
    svg += `<path d="${d}" fill="none" stroke="${s.farbe}" stroke-width="2" stroke-linejoin="round" ${s.strich ? 'stroke-dasharray="5 4"' : ""}/>`;
  }
  svg += `<line class="fk" x1="0" x2="0" y1="${O}" y2="${H - U}" stroke="var(--linie-stark)" visibility="hidden"/>`;
  svg += `<rect x="${L}" y="0" width="${B - L - R}" height="${H}" fill="transparent"/></svg>`;
  el.insertAdjacentHTML("beforeend", legende(serien) + svg);
  const sv = el.querySelector("svg:last-of-type"), fk = sv.querySelector(".fk");
  sv.addEventListener("pointermove", ev => {
    const r = sv.getBoundingClientRect(), vx = (ev.clientX - r.left) / r.width * B;
    const ziel = x0 + (vx - L) / (B - L - R) * (x1 - x0);
    let i = 0, best = Infinity; t.forEach((v, k) => { const d = Math.abs(v - ziel); if (d < best) { best = d; i = k; } });
    fk.setAttribute("x1", X(t[i])); fk.setAttribute("x2", X(t[i])); fk.setAttribute("visibility", "visible");
    tipZeigen(ev, `<div class="z">${xfmt(t[i])}</div>` + serien.map(s => `<div><i style="--f:${s.farbe}"></i>${esc(s.name)}: <b class="zahl">${s.werte[i] == null ? "–" : fmt(s.werte[i])}${einheit}</b></div>`).join(""));
  });
  sv.addEventListener("pointerleave", () => { fk.setAttribute("visibility", "hidden"); tipWeg(); });
}

// Streudiagramm mit Regressionsgerade
function streuung(el, punkte, { xName, yName, reg, xfmt = v => F(v, 2), yfmt = v => F(v, 1), hoehe = 240 }) {
  const B = breite(el), H = hoehe, L = 48, R = 10, O = 10, U = 24;
  if (!punkte.length) { el.innerHTML += `<div class="dneben">keine Daten</div>`; return; }
  const xs = punkte.map(p => p[0]), ys = punkte.map(p => p[1]);
  const qx = [...xs].sort((a, b) => a - b), qy = [...ys].sort((a, b) => a - b);
  const q = (a, f) => a[Math.min(a.length - 1, Math.floor(a.length * f))];          // Ausreißer abschneiden
  const x = skala(q(qx, .01), q(qx, .99)), y = skala(q(qy, .01), q(qy, .99));
  const X = v => L + (Math.max(x.lo, Math.min(x.hi, v)) - x.lo) / (x.hi - x.lo) * (B - L - R);
  const Y = v => O + (1 - (Math.max(y.lo, Math.min(y.hi, v)) - y.lo) / (y.hi - y.lo)) * (H - O - U);
  let svg = `<svg class="chart" viewBox="0 0 ${B} ${H}" role="img">`;
  for (const v of y.ticks) svg += `<line x1="${L}" x2="${B - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--gitter)"/><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${yfmt(v)}</text>`;
  for (const v of x.ticks) svg += `<text x="${X(v)}" y="${H - 8}" text-anchor="middle">${xfmt(v)}</text>`;
  for (const [a, b] of punkte) svg += `<circle cx="${X(a).toFixed(1)}" cy="${Y(b).toFixed(1)}" r="2.6" fill="var(--s1)" fill-opacity=".45"/>`;
  if (reg && reg.beta != null) svg += `<line x1="${X(x.lo)}" y1="${Y(reg.alpha + reg.beta * x.lo)}" x2="${X(x.hi)}" y2="${Y(reg.alpha + reg.beta * x.hi)}" stroke="var(--s2)" stroke-width="2"/>`;
  svg += `<rect x="${L}" y="0" width="${B - L - R}" height="${H}" fill="transparent"/></svg>`;
  el.insertAdjacentHTML("beforeend", `<div class="legende"><span style="--f:var(--s1)">je Zeitfenster ein Punkt</span>${reg ? `<span style="--f:var(--s2)">Regressionsgerade</span>` : ""}</div>` + svg);
  const sv = el.querySelector("svg:last-of-type");
  sv.addEventListener("pointermove", ev => {
    const r = sv.getBoundingClientRect(), vx = (ev.clientX - r.left) / r.width * B, vy = (ev.clientY - r.top) / r.height * H;
    let best = Infinity, p = null; for (const k of punkte) { const d = (X(k[0]) - vx) ** 2 + (Y(k[1]) - vy) ** 2; if (d < best) { best = d; p = k; } }
    if (p && best < 900) tipZeigen(ev, `${esc(xName)}: <b class="zahl">${xfmt(p[0])}</b><br>${esc(yName)}: <b class="zahl">${yfmt(p[1])}</b>`); else tipWeg();
  });
  sv.addEventListener("pointerleave", tipWeg);
}

function karte(titel, neben = "") {
  const d = document.createElement("div"); d.className = "karte diagramm";
  d.innerHTML = `<div class="dtitel">${titel}</div>${neben ? `<div class="dneben">${neben}</div>` : ""}`;
  return d;
}
const kachel = (titel, wert, neben = "") => `<div class="karte kachel"><div class="titel">${titel}</div><div class="wert zahl">${wert}</div><div class="neben">${neben}</div></div>`;
const rubrik = (titel, rechts = "") => `<div class="rubrik"><h2>${titel}</h2>${rechts ? `<span class="rechts">${rechts}</span>` : ""}</div>`;
function tabelle(kopf, zeilen) {
  return `<div class="karte rahmen"><table><thead><tr>${kopf.map(k => `<th class="${k[1] || ""}">${k[0]}</th>`).join("")}</tr></thead>
    <tbody>${zeilen.map(z => `<tr>${z.map((w, i) => `<td class="${kopf[i][1] || ""}">${w}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
// Divergierende Zelle: blau positiv, rot negativ, grau neutral
function zelle(v, max) {
  if (v == null) return "–";
  const a = Math.min(1, Math.abs(v) / (max || 1)), f = v >= 0 ? "var(--pos)" : "var(--neg)";
  return `<span class="zahl" style="display:inline-block;min-width:64px;padding:2px 6px;border-radius:4px;background:color-mix(in srgb, ${f} ${Math.round(a * 45)}%, var(--mitte-grau))">${v > 0 ? "+" : ""}${F(v, 2)}</span>`;
}

// Mittelkurs und Wände in einer gemeinsamen Preisskala
function wandBild(k, c, w) {
  const B = breite(k), H = 260, L = 56, R = 10, O = 10, U = 22;
  const t = c.mitte.map(x => x[0]); if (!t.length) return;
  const preise = c.mitte.map(x => x[1]).concat(w.map(x => x.preis));
  const y = skala(Math.min(...preise), Math.max(...preise)), x0 = t[0], x1 = t[t.length - 1];
  const X = v => L + (Math.max(x0, Math.min(x1, v)) - x0) / ((x1 - x0) || 1) * (B - L - R), Y = v => O + (1 - (v - y.lo) / (y.hi - y.lo)) * (H - O - U);
  let svg = `<svg class="chart" viewBox="0 0 ${B} ${H}">`;
  for (const v of y.ticks) svg += `<line x1="${L}" x2="${B - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--gitter)"/><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${F(v, 2)}</text>`;
  for (let i = 0; i < 6; i++) { const v = x0 + (x1 - x0) * i / 5; svg += `<text x="${X(v)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === 5 ? "end" : "middle"}">${(x1 - x0 < 600 ? UHRS : UHR)(v)}</text>`; }
  svg += `<path d="${c.mitte.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join("")}" fill="none" stroke="var(--ton-3)" stroke-width="1.5"/>`;
  w.forEach((x, i) => {
    const f = x.seite === "B" ? "var(--gut)" : "var(--kritisch)", x1_ = X(x.start), x2_ = Math.max(X(x.ende), x1_ + 3);

async function fzLaden() {

  if (!FZ.wert || !FZ.werte.werte.some(w => w.id === FZ.wert)) FZ.wert = (FZ.werte.werte[0] || {}).id;
  const q = new URLSearchParams({ wert: FZ.wert, tf: FZ.tf, staerke: FZ.staerke });
  [FZ.daten, FZ.alarme] = await Promise.all([fetch("api/formationen?" + q).then(r => r.json()), fetch("api/alarme").then(r => r.json())]);

      esc(x.richtung), `<span class="marke ${STATUS[x.status] ?? ""}">${esc(x.status)}</span>`, x.guete != null ? `<span class="zahl">${x.guete}</span>` : "–",
      x.ziel ? `<span class="zahl" title="${esc(x.ziel_text || "")}">${fpreis(x.ziel)}</span>` : "–", `<span style="white-space:normal">${esc(x.text || "")}</span>`,

    `<p class="fussnote">Formationen sind Ermessenssache: Die Erkennung folgt festen Regeln mit Toleranzen nach der ATR. Bestätigt heißt: Der Schlusskurs hat die entscheidende Linie überschritten. Die Güte (0–100) bewertet Berührungen, Passgenauigkeit, Symmetrie und das Volumen beim Ausbruch. Das Kursziel folgt der Measure Rule mit Bulkowskis Anteilen der Formationshöhe (z. B. 51 % bei Schulter-Kopf-Schulter, 70 % beim Doppeltief), weil die volle Höhe im Schnitt nicht erreicht wird. Ein Handelssignal ist das nicht.</p>`));

  alarmeZeichnen(m, wert);
}

const UHRZ = s => new Date(s * 1000).toLocaleString("de-DE", { timeZone: "Europe/Berlin", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });

// Kerzenchart mit Formationen: Volumen unten, EMA 21, letzter Kurs am Rand, Beschriftung je Formation, rechnerische Ziele gestrichelt
function kerzenChart(el, k, formationen, auswahl, opt = {}) {
  const tf = opt.tf || FZ.tf, kompakt = !!opt.kompakt;
  const B = breite(el), H = opt.hoehe || 380, L = kompakt ? 8 : 58, R = kompakt ? 62 : 64, O = 10, U = 22, VH = Math.round((H - O - U) * 0.16);
  const n = k.length, bx = (B - L - R) / n;
  const sichtbar = formationen.filter((_, i) => auswahl == null || i === auswahl);
  const preise = k.flatMap(x => [x[2], x[3]]);
  const extra = sichtbar.flatMap(f => [...f.linien.flatMap(l => [l.p1, l.p2]), ...(f.zone || []), ...(f.ziel ? [f.ziel] : [])]);
  const lo0 = Math.min(...preise), hi0 = Math.max(...preise), spanne = hi0 - lo0;
  const imBild = extra.filter(p => p > lo0 - spanne * .3 && p < hi0 + spanne * .3);   // ferne Linien nicht die Skala sprengen lassen
  const y = skala(Math.min(lo0, ...imBild), Math.max(hi0, ...imBild), kompakt ? 4 : 5);
  const unten = H - U - VH - 4;
  const X = i => L + (i + .5) * bx, Y = v => O + (1 - (v - y.lo) / (y.hi - y.lo)) * (unten - O);
  const zeiten = k.map(x => x[0]);
  const idx = t => { let lo = 0, hi = n - 1; if (t <= zeiten[0]) return (t - zeiten[0]) / ((zeiten[1] - zeiten[0]) || 1); if (t > zeiten[n - 1]) return n - 1 + (t - zeiten[n - 1]) / ((zeiten[n - 1] - zeiten[n - 2]) || 1); while (lo < hi) { const mid = (lo + hi) >> 1; if (zeiten[mid] < t) lo = mid + 1; else hi = mid; } return lo; };
  const clip = "fzclip" + Math.random().toString(36).slice(2, 8);
  const fp = v => F(v, v < 10 ? 3 : 2);
  let svg = `<svg class="chart" viewBox="0 0 ${B} ${H}"><defs><clipPath id="${clip}"><rect x="${L}" y="${O}" width="${B - L - R}" height="${unten - O}"/></clipPath></defs>`;
  for (const v of y.ticks) if (v >= y.lo && v <= y.hi) svg += `<line x1="${L}" x2="${B - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--gitter)"/><text x="${B - R + 6}" y="${Y(v) + 3}">${fp(v)}</text>`;
  const fmtX = tf === "1d" ? (s => new Date(s * 1000).toLocaleDateString("de-DE", { timeZone: "Europe/Berlin", day: "2-digit", month: "2-digit", year: "2-digit" })) : UHRZ;
  const nx = kompakt ? 4 : 6;
  for (let j = 0; j < nx; j++) { const i = Math.round((n - 1) * j / (nx - 1)); svg += `<text x="${X(i)}" y="${H - 6}" text-anchor="${j === 0 ? "start" : j === nx - 1 ? "end" : "middle"}">${fmtX(k[i][0])}</text>`; }
  // Volumen
  const vmax = Math.max(...k.map(x => x[5] || 0)) || 1;
  k.forEach(([t, o, h, l, c, v], i) => { const hh = (v || 0) / vmax * VH; svg += `<rect x="${X(i) - Math.max(.5, bx * .32)}" width="${Math.max(1, bx * .64)}" y="${H - U - hh}" height="${hh}" fill="${c >= o ? "var(--gut)" : "var(--kritisch)"}" fill-opacity=".28"/>`; });
  svg += `<g clip-path="url(#${clip})">`;
  for (const f of sichtbar) if (f.zone) svg += `<rect x="${L}" width="${B - L - R}" y="${Y(f.zone[1])}" height="${Math.max(2, Y(f.zone[0]) - Y(f.zone[1]))}" fill="${f.art === "widerstand" ? "var(--kritisch)" : "var(--gut)"}" fill-opacity=".13"/>`;
  // Flächen der Formationen mit zwei Linien (Dreiecke, Keile, Flaggen) leicht füllen
  for (const f of sichtbar) if (f.linien.length === 2) {
    const [a, b] = f.linien; svg += `<polygon points="${X(idx(a.t1))},${Y(a.p1)} ${X(idx(a.t2))},${Y(a.p2)} ${X(idx(b.t2))},${Y(b.p2)} ${X(idx(b.t1))},${Y(b.p1)}" fill="${RICHTUNGSFARBE[f.richtung]}" fill-opacity=".08"/>`;
  }
  const w = Math.max(1, Math.min(9, bx * .64));
  k.forEach(([t, o, h, l, c], i) => {
    const f = c >= o ? "var(--gut)" : "var(--kritisch)";
    svg += `<line x1="${X(i)}" x2="${X(i)}" y1="${Y(h)}" y2="${Y(l)}" stroke="${f}" stroke-width="1"/><rect x="${X(i) - w / 2}" width="${w}" y="${Y(Math.max(o, c))}" height="${Math.max(1, Math.abs(Y(o) - Y(c)))}" fill="${f}" rx="1"/>`;
  });
  if (opt.ema !== false && n > 21) {                                  // EMA 21 als ruhige Orientierung
    let e = k[0][4], d = ""; const a_ = 2 / 22;
    k.forEach((x, i) => { e = i ? x[4] * a_ + e * (1 - a_) : e; if (i >= 20) d += (i > 20 ? "L" : "M") + X(i).toFixed(1) + "," + Y(e).toFixed(1); });
    svg += `<path d="${d}" fill="none" stroke="var(--ton-3)" stroke-width="1.2" stroke-opacity=".7"/>`;
  }
  const marken = [];
  for (const f of sichtbar) {
    for (const l of f.linien) svg += `<line x1="${X(idx(l.t1))}" y1="${Y(l.p1)}" x2="${X(idx(l.t2))}" y2="${Y(l.p2)}" stroke="${LINIENFARBE[l.art] || "var(--s4)"}" stroke-width="2" ${l.art === "nackenlinie" ? 'stroke-dasharray="6 4"' : ""}/>`;
    if (f.punkte.length >= 3 && !["unterstuetzung", "widerstand", "trendlinie"].includes(f.art))
      svg += `<polyline points="${f.punkte.map(([t, p]) => `${X(idx(t))},${Y(p)}`).join(" ")}" fill="none" stroke="var(--s4)" stroke-width="1.5" stroke-opacity=".8"/>`;
    for (const [t, p] of f.punkte) svg += `<circle cx="${X(idx(t))}" cy="${Y(p)}" r="${kompakt ? 3 : 4}" fill="var(--karte)" stroke="${RICHTUNGSFARBE[f.richtung]}" stroke-width="2"/>`;
    if (f.ereignis_t && (f.status === "bestätigt" || f.status === "gebrochen") && f.linien.length) {   // Ausbruch markieren
      const i = Math.round(idx(f.ereignis_t)); if (i >= 0 && i < n) svg += `<path d="M${X(i)},${Y(k[i][4]) - 9} l-5,-8 h10 z" fill="${RICHTUNGSFARBE[f.richtung]}"/>`;
    }
    if (f.ziel && opt.ziele !== false) { svg += `<line x1="${X(Math.max(0, n - 25))}" x2="${B - R}" y1="${Y(f.ziel)}" y2="${Y(f.ziel)}" stroke="${RICHTUNGSFARBE[f.richtung]}" stroke-width="1.3" stroke-dasharray="3 4"/>`; marken.push([f.ziel, "Ziel", RICHTUNGSFARBE[f.richtung]]); }
    if (opt.labels !== false) {                                      // Beschriftung am letzten Punkt der Formation
      const p = f.punkte.length ? f.punkte[f.punkte.length - 1] : f.linien.length ? [f.linien[0].t2, f.linien[0].p2] : f.zone ? [zeiten[Math.max(0, n - 30)], f.zone[1]] : null;
      if (p) { const xx = Math.min(B - R - 6, Math.max(L + 4, X(idx(p[0])))), yy = Math.max(O + 12, Y(p[1]) - 9); svg += `<text x="${xx}" y="${yy}" text-anchor="${xx > B - R - 120 ? "end" : "middle"}" style="font-family:inherit;font-size:10.5px;fill:var(--ton-1);paint-order:stroke;stroke:var(--karte);stroke-width:3px">${esc(f.name.replace(/ (bestätigt|gebrochen)$/, ""))}</text>`; }

  for (const [v, txt, f] of marken) if (v >= y.lo && v <= y.hi) svg += `<line x1="${L}" x2="${B - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${f}" stroke-width=".8" stroke-dasharray="1 3" ${txt ? 'visibility="hidden"' : ""}/><rect x="${B - R + 2}" y="${Y(v) - 8}" width="${R - 4}" height="16" rx="3" fill="${f}"/><text x="${B - R + 6}" y="${Y(v) + 4}" style="fill:#fff">${txt ? txt + " " : ""}${fp(v)}</text>`;
  svg += `<line class="fk" x1="0" x2="0" y1="${O}" y2="${H - U}" stroke="var(--linie-stark)" visibility="hidden"/><rect x="${L}" y="0" width="${B - L - R}" height="${H}" fill="transparent"/></svg>`;
  el.insertAdjacentHTML("beforeend", (kompakt ? "" : `<div class="legende"><span style="--f:var(--gut)">steigende Kerze, Unterstützung</span><span style="--f:var(--kritisch)">fallende Kerze, Widerstand</span><span class="strich" style="--f:var(--s4)">Nackenlinie, Formation</span><span style="--f:var(--ton-3)">EMA 21</span></div>`) + svg);

async function alarmAnlegen(regel) {
  const r = await fetch("api/alarme", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(regel) });
  const d = await r.json();
  if (!r.ok) { alert("Alarm nicht angelegt: " + (d.fehler || r.status)); return; }
  zeichnen();
}

function alarmAusFormation(f, wie) {
  const basis = { wert: FZ.wert, tf: FZ.tf, quelle: "formation", notiz: f.name };
  if (wie === "art") return alarmAnlegen({ ...basis, art: "formation", arten: [f.art], staerke: FZ.staerke });
  if (f.zone) return alarmAnlegen({ ...basis, art: "zone", lo: f.zone[0], hi: f.zone[1], richtung: f.art === "widerstand" ? "ueber" : "unter" });
  const l = f.linien[0];
  const richtung = l.art === "widerstand" ? "ueber" : l.art === "unterstuetzung" ? "unter" : f.richtung === "bullisch" ? "ueber" : "unter";
  return alarmAnlegen({ ...basis, art: "linie", t1: l.t1, p1: l.p1, t2: l.t2, p2: l.p2, richtung });
}

function bedingung(r) {
  const ri = { ueber: "nach oben", unter: "nach unten", beide: "in beide Richtungen" }[r.richtung];
  if (r.art === "preis") return `Kurs ${r.richtung === "ueber" ? "über" : r.richtung === "unter" ? "unter" : "kreuzt"} ${F(r.preis, 2)}`;
  if (r.art === "linie") return `Linie ${F(r.p1, 2)} → ${F(r.p2, 2)} bricht ${ri}`;
  if (r.art === "zone") return `Zone ${F(r.lo, 2)}–${F(r.hi, 2)} verlassen ${ri}`;
  return `Formation bestätigt: ${r.arten.map(a => FZ.werte.arten[a] || a).join(", ")}`;
}

const fmtWert = w => typeof w === "number" ? F(w, Number.isInteger(w) ? 0 : 2) : (w == null ? "–" : String(w));
function ols(punkte) {
  const n = punkte.length; if (n < 3) return null;
  const mx = punkte.reduce((s, p) => s + p[0], 0) / n, my = punkte.reduce((s, p) => s + p[1], 0) / n;
  let sxy = 0, sxx = 0; for (const [x, y] of punkte) { sxy += (x - mx) * (y - my); sxx += (x - mx) ** 2; }
  if (!sxx) return null; const beta = sxy / sxx; return { beta, alpha: my - beta * mx };
}
function mdLite(src) {
  let h = esc(src).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>").replace(/^#{1,6}\s*(.+)$/gm, "<b>$1</b>");
  return h.split(/\n{2,}/).map(p => /^(\s*[-*•] .*\n?)+$/.test(p) ? "<ul>" + p.trim().split("\n").map(l => `<li>${l.replace(/^\s*[-*•] /, "")}</li>`).join("") + "</ul>" : `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
}

async function studieZeichnen(box, id) {

  if (s.fehler === "unbekannt") { PSD.id = null; return; }
  // Warten ohne Neuaufbau: nur der Stand der Studie wird im Hintergrund abgefragt. Wechselt der Schritt, wird nur diese
  // Karte neu gezeichnet; ist die Studie fertig (oder fehlgeschlagen), einmal die ganze Ansicht.
  const WARTEND = ["uebersetzt", "neu", "rechnet", "kommentiert"];
  const warten = (text, schritt) => {
    const seit = Date.parse(s.geprueft || s.erstellt) || Date.now();
    box.innerHTML = `<div class="karte lab-warten"><div class="lab-warten-kopf"><span class="lab-puls"></span><b>${esc(s.titel || "Neue Strategie")}</b><span>${text}</span><span class="lab-zeit zahl" id="lab-zeit"></span></div>${labSchritte(schritt)}</div>`;

    uhr(); const zaehler = setInterval(() => { if (!uhr()) clearInterval(zaehler); }, 1000);
    const nachsehen = async () => {

      if (neu && !WARTEND.includes(neu.status)) { clearInterval(zaehler); zeichnen(); return; }        // fertig: einmal neu laden

async function kurvenZeichnen(w) {
  const box = $("#ps-kurven"); if (!box) return;
  lwAufraeumen(); box.innerHTML = "";
  const k1 = karte(`${esc(w.symbol)}: Kapital gegen Kaufen und Halten`, `Start 100 · ab ${datum(w.pruef_ab)} Prüfteil · Klick auf einen Wert in der Tabelle wechselt`); k1.style.marginTop = "12px"; box.append(k1);
  try {
    await lwLaden();
    const LW = window.LightweightCharts, el = document.createElement("div"); el.className = "lw"; el.style.height = "300px"; k1.append(el);
    const c = LW.createChart(el, { autoSize: true, layout: { attributionLogo: false, background: { type: "solid", color: ICC.bg }, textColor: ICC.text, fontSize: 11 },
      grid: { vertLines: { color: ICC.grid }, horzLines: { color: ICC.grid } }, rightPriceScale: { borderColor: ICC.line }, timeScale: { borderColor: ICC.line }, localization: { locale: "de-DE" } });
    LW_CHARTS.push(c);
    const bh = c.addLineSeries({ color: "#8b93a1", lineWidth: 1.5, priceLineVisible: false, title: "Kaufen und Halten" });
    const st = c.addLineSeries({ color: "#48a6f2", lineWidth: 2, priceLineVisible: false, title: "Strategie" });
    st.setData(w.kurve.map(([t, e]) => ({ time: t, value: e }))); bh.setData(w.kurve.map(([t, , b]) => ({ time: t, value: b })));
    const ab = w.kurve.find(([t]) => t >= w.pruef_ab); if (ab) st.setMarkers([{ time: ab[0], position: "aboveBar", shape: "arrowDown", color: "#f5b942", text: "Prüfteil ab hier" }]);
    c.timeScale().fitContent();
  } catch (e) { k1.insertAdjacentHTML("beforeend", `<div class="dneben">Chart nicht verfügbar</div>`); }
  // Kerzen mit Käufen und Verkäufen
  const k2 = karte(`${esc(w.symbol)}: Trades`, "▲ Kauf · ▼ Verkauf · gelb im Prüfteil"); k2.style.marginTop = "12px"; box.append(k2);
  const kz = (await (await fetch(`api/kerzen?wert=${encodeURIComponent(w.symbol)}&tf=1d&anzahl=5000`)).json()).kerzen;
  const marker = w.trades.flatMap(t => [{ t: t.in, position: "belowBar", shape: "arrowUp", color: t.teil === "pruef" ? "#f5b942" : ICC.up, text: "" },
    { t: t.out, position: "aboveBar", shape: "arrowDown", color: t.teil === "pruef" ? "#f5b942" : ICC.down, text: t.grund === "Signal" ? "" : t.grund }]);
  await zeichneChart(k2, kz, [], null, { hoehe: 380, tf: "1d", sichtbar: Math.round(kz.length * 0.4), zoom: true, marker, niveaus: [] });
}

    linie(kk, { t: r.t, serien: r.serien.map((s, i) => ({ name: s.name, werte: s.werte, farbe: farbe(i + 1) })), fmt: v => F(v, r.stellen == null ? 2 : r.stellen), einheit: r.einheit || "", null: !!r.null });

// --- Claude: Morgenlage, Nachbesprechung, Bilanz, Dossiers ---------------------------------------------
// Briefing (Morgenlage, Nachbesprechung) lesbar aufbereiten: „Worauf ich achte“ nach oben, Kurzfassung groß,
// Märkte als Karten, Kurzpunkte („**Alarme:** …“) als Liste, Prozentwerte grün oder rot.
function briefingZeile(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])([+\-−–]\s?\d[\d.]*(?:,\d+)?\s?%)/g, (_, vor, zahl) => `${vor}<span class="${zahl.startsWith("+") ? "pos" : "neg"} cl-zahl">${zahl}</span>`);
}
function briefingBlock(zeilen) {
  let html = "", liste = null, details = null;
  const zu = () => { if (liste) { html += `</${liste}>`; liste = null; } };
  for (const roh of zeilen) {
    const s = roh.trim();
    if (/^:::\s*\S/.test(s)) { zu(); details = []; continue; }
    if (s === ":::" && details) { html += `<details class="cl-details"><summary>Herleitung</summary>${briefingBlock(details)}</details>`; details = null; continue; }
    if (details) { details.push(roh); continue; }
    if (!s) { zu(); continue; }
    const p = s.match(/^[-*•]\s+(.*)$/), n = s.match(/^\d+[.)]\s+(.*)$/);
    if (p || n) { const art = p ? "ul" : "ol"; if (liste !== art) { zu(); html += `<${art}>`; liste = art; } html += `<li>${briefingZeile((p || n)[1])}</li>`; continue; }
    zu(); html += `<p>${briefingZeile(s)}</p>`;
  }
  zu();
  return html;
}
// Briefing zerlegen: „Worauf ich achte“ und Kurzfassung für den Kopf, der Rest als ruhiger Text in einer Spalte
// Spalte „danach“: geprüfte Einschätzungen mit Ergebnis, offene mit laufendem Stand gegen den Kurs aus dem Speicher
function einschaetzungStand(e) {
  const fertig = v => `<td class="r zahl ${v > 0 ? "pos" : v < 0 ? "neg" : ""}">${(v > 0 ? "+" : "") + F(v, 2) + " %"}</td>`;
  if (e.aenderung_pct != null) return fertig(e.aenderung_pct);
  const k = FOK.letzter[e.wert];
  if (e.ergebnis || k == null || !e.kurs) return `<td class="r zahl">–</td>`;
  const v = (k - e.kurs) / e.kurs * 100, s = CL.schwellen?.[e.horizont] ?? 0.3, r = String(e.richtung);
  const passt = /steig/.test(r) ? v > s : /f(a|ä|ae)ll/.test(r) ? v < -s : Math.abs(v) <= s;   // Richtung kommt als „faellt“ oder „fällt“
  const rest = Math.max(0, (Date.parse(e.faellig) - Date.now()) / 36e5);
  return `<td class="r zahl cl-laeuft" title="läuft noch: Stand gegen den Kurs bei der Einschätzung, ${passt ? "derzeit spricht der Kurs dafür" : "derzeit spricht der Kurs dagegen"}">${(v > 0 ? "+" : "") + F(v, 2)} %<small>noch ${rest >= 1 ? F(rest, 0) + " Std." : F(rest * 60, 0) + " Min."} · <b class="${passt ? "pos" : "neg"}">${passt ? "dafür" : "dagegen"}</b></small></td>`;
}
function briefingTeile(text) {
  const bloecke = [{ titel: "", zeilen: [] }], kurz = [], fuss = [];
  for (const roh of String(text || "").replace(/\r/g, "").split("\n")) {
    const s = roh.trim(); let m;
    if ((m = s.match(/^#{1,3}\s+(.+)$/)) || (m = s.match(/^\*\*([^*]+?)\*\*:?$/))) { bloecke.push({ titel: m[1].replace(/:$/, ""), zeilen: [] }); continue; }
    if ((m = s.match(/^\*\*Kurz:?\*\*:?\s*(.*)$/i))) { kurz.push(m[1]); continue; }
    if (/keine Anlageberatung/i.test(s)) { fuss.push(s); continue; }
    bloecke[bloecke.length - 1].zeilen.push(roh);
  }
  const i = bloecke.findIndex(x => /im fokus|worauf|im blick|achte/i.test(x.titel));
  const fokus = i > 0 ? bloecke.splice(i, 1)[0] : null;
  const punkte = fokus ? fokus.zeilen.map(z => z.trim().match(/^(?:\d+[.)]|[-*•])\s+(.*)$/)).filter(Boolean).map(x => x[1]) : [];
  // Kurslisten je Markt (ältere Briefings) gehören nicht ins Briefing; die Kurse stehen im Reiter Kurse
  const rest = bloecke.filter(x => (x.titel || x.zeilen.some(z => z.trim())) && !/🇺🇸|🇩🇪|₿|\bUSA\b|Krypto|Deutschland|Deutsche Werte/i.test(x.titel))
    .map(x => `${x.titel ? `<h4>${briefingZeile(x.titel)}</h4>` : ""}${briefingBlock(x.zeilen)}`).join("") + (fuss.length ? `<p class="cl-fuss">${briefingZeile(fuss.join(" "))}</p>` : "");
  return { punkte, kurz: kurz.join(" "), rest };
}

const CL = { filter: "alle", wert: "", sort: "zeit", ab: true, eintraege: [] };
const CL_RICHTUNG = { steigt: ["gut", "↑ steigt"], faellt: ["krit", "↓ fällt"], "fällt": ["krit", "↓ fällt"], seitwaerts: ["", "→ seitwärts"], "seitwärts": ["", "→ seitwärts"] };

    <div class="karte rahmen rollbar"><table class="cl-tab"><thead><tr>${kopf("zeit", "Zeit")}${kopf("symbol", "Wert")}${kopf("richtung", "Richtung")}${kopf("horizont", "Horizont")}${kopf("kurs", "Kurs", "r")}${kopf("danach", "Stand", "r")}${kopf("ergebnis", "Ergebnis")}<th>Begründung</th></tr></thead><tbody>
    ${liste.map(e => { const [rt, rtext] = CL_RICHTUNG[e.richtung] || ["", esc(e.richtung)];

// Im Fokus als Entscheidungsleisten: Marken aus der Morgenlage (/api/fokus), Kurs live aus dem Speicher (/api/kerzen, alle 30 s)
const FOK = { timer: null, letzter: {}, kerzen: {}, punkte: [] };
const fokZahl = x => F(x, x >= 10000 || Number.isInteger(x) ? 0 : 2);   // Marken so genau wie im Text: 4.126,64, aber 1.099 und 82.850
async function fokusKurse(werte, mitVerlauf = []) {
  await Promise.all([...new Set(werte)].map(async w => {
    const verlauf = mitVerlauf.includes(w);
    try {
      const r = await (await fetch(`api/kerzen?wert=${encodeURIComponent(w)}&tf=${verlauf ? "1d" : "1m"}&anzahl=${verlauf ? 40 : 2}`)).json();
      if (r.letzter) FOK.letzter[w] = r.letzter[1];
      if (verlauf) FOK.kerzen[w] = r.kerzen || [];
    } catch (e) { /* Wert ohne Kurs: Feld bleibt leer */ }
  }));
}
// Text: These als Einstieg, Herleitung in Absätzen zu höchstens drei Sätzen, die beiden Grenzen im Text markiert
function hlText(p) {
  const marken = [p.oben.kurs, p.unten.kurs].map(fokZahl);
  const saetze = String(p.herleitung || "").split(/(?<=[.!?])\s+(?=[A-ZÄÖÜ„])/).filter(Boolean);
  const absaetze = [];
  for (let i = 0; i < saetze.length; i += 3) absaetze.push(saetze.slice(i, i + 3).join(" "));
  const markieren = s => marken.reduce((t, mk) => t.split(mk).join(`<mark>${mk}</mark>`), briefingZeile(s));
  return `${p.these ? `<p class="hl-lead">${esc(p.these)}</p>` : ""}${absaetze.map(a => `<p>${markieren(a)}</p>`).join("")}`;
}
// Chart: Tagesschluss der letzten ~40 Tage (letzter Punkt live) mit Raster, Achsen und „heute“-Linie;
// rechts davon fächern zwei Szenario-Linien zu den Grenzen aus der Morgenlage auf. Gezeichnet in echten Pixeln.
const nett = r => { const e = 10 ** Math.floor(Math.log10(r)), f = r / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; };
function fokusChart(el, p) {
  const kz = FOK.kerzen[p.wert] || [], k = FOK.letzter[p.wert], u = p.unten.kurs, o = p.oben.kurs;
  if (kz.length < 2) { el.innerHTML = `<div class="fok-leer">Noch kein Verlauf</div>`; return; }
  const c = kz.map(z => z[4]); if (k != null) c[c.length - 1] = k;
  const jetzt = c[c.length - 1], n = c.length;
  const W = Math.max(480, Math.round(el.clientWidth || 900)), H = 290, OBEN = 14, UNTEN = 30, RECHTS = 64;
  const x0 = 2, x1 = W - RECHTS, xd = x0 + (x1 - x0) * .76, xe = x1 - 12;
  let lo = Math.min(u, ...c), hi = Math.max(o, ...c); const rand = (hi - lo) * .16; lo -= rand; hi += rand;
  const schritt = nett((hi - lo) / 4), dez = schritt >= 1 ? 0 : schritt >= .1 ? 1 : 2;
  const y = v => OBEN + (hi - v) / (hi - lo) * (H - OBEN - UNTEN), x = i => x0 + i / (n - 1) * (xd - x0), r1 = v => v.toFixed(1);
  const linie = c.map((v, i) => `${i ? "L" : "M"}${r1(x(i))},${r1(y(v))}`).join("");
  let raster = "";
  for (let v = Math.ceil(lo / schritt) * schritt; v <= hi; v += schritt)
    raster += `<line class="fc-raster" x1="${x0}" x2="${x1}" y1="${r1(y(v))}" y2="${r1(y(v))}"/><text class="fc-achse" x="${x1 + 10}" y="${r1(y(v) + 4)}">${F(v, dez)}</text>`;
  const tag = s => new Date(s * 1000).toLocaleDateString("de-DE", { timeZone: "Europe/Berlin", day: "2-digit", month: "2-digit" });
  const daten = [0, Math.round(n / 3), Math.round(2 * n / 3)].map(i => `<text class="fc-achse" x="${r1(x(i))}" y="${H - 8}"${i ? ' text-anchor="middle"' : ""}>${tag(kz[i][0])}</text>`).join("");
  const abst = g => { const d = (g - jetzt) / jetzt * 100; return `(${Math.abs(d) < .05 ? "an der Marke" : `${d > 0 ? "+" : "−"}${F(Math.abs(d), 1)} %`})`; };
  const yo = y(o), yu = y(u), yj = y(jetzt);
  const etikettO = yo - 12 < OBEN + 10 ? yo + 20 : yo - 12, etikettU = yu + 20 > H - UNTEN ? yu - 12 : yu + 20;
  const jetztText = `jetzt ${F(jetzt, 2)}`, jw = jetztText.length * 6.6 + 14, jy = yj - 26 < OBEN ? yj + 10 : yj - 30;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kursverlauf mit Grenzen">
    <defs><linearGradient id="fc-fl-${p.wert}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="fc-fl-a"/><stop offset="1" class="fc-fl-b"/></linearGradient></defs>
    ${raster}${daten}
    <rect class="fc-zukunft" x="${r1(xd)}" y="${OBEN}" width="${r1(x1 - xd)}" height="${H - OBEN - UNTEN}"/>
    <line class="fc-grenze oben" x1="${x0}" x2="${x1}" y1="${r1(yo)}" y2="${r1(yo)}"/><line class="fc-grenze unten" x1="${x0}" x2="${x1}" y1="${r1(yu)}" y2="${r1(yu)}"/>
    <path class="fc-flaeche" fill="url(#fc-fl-${p.wert})" d="${linie}L${r1(xd)},${H - UNTEN}L${x0},${H - UNTEN}Z"/>
    <path class="fc-kurs" d="${linie}"/>
    <line class="fc-heute" x1="${r1(xd)}" x2="${r1(xd)}" y1="${OBEN}" y2="${H - UNTEN}"/><text class="fc-achse" x="${r1(xd)}" y="${H - 8}" text-anchor="middle">heute</text>
    <line class="fc-fan oben" x1="${r1(xd)}" y1="${r1(yj)}" x2="${r1(xe)}" y2="${r1(yo)}"/><circle class="fc-ende oben" cx="${r1(xe)}" cy="${r1(yo)}" r="4"/>
    <line class="fc-fan unten" x1="${r1(xd)}" y1="${r1(yj)}" x2="${r1(xe)}" y2="${r1(yu)}"/><circle class="fc-ende unten" cx="${r1(xe)}" cy="${r1(yu)}" r="4"/>
    <text class="fc-ziel oben" x="${r1(xe)}" y="${r1(etikettO)}" text-anchor="end">${fokZahl(o)} ${abst(o)}</text>
    <text class="fc-ziel unten" x="${r1(xe)}" y="${r1(etikettU)}" text-anchor="end">${fokZahl(u)} ${abst(u)}</text>
    <rect class="fc-jetzt-bg" x="${r1(xd - 12 - jw)}" y="${r1(jy)}" width="${r1(jw)}" height="20" rx="6"/>
    <text class="fc-jetzt" x="${r1(xd - 12 - jw / 2)}" y="${r1(jy + 14)}" text-anchor="middle">${jetztText}</text>
    <circle class="fc-punkt" cx="${r1(xd)}" cy="${r1(yj)}" r="5"/>
  </svg>`;
}
function fokusAuffrischen() {                                         // alle 30 s: Chart mit dem letzten Kurs
  document.querySelectorAll(".hl").forEach(z => { const p = FOK.punkte[+z.dataset.i]; if (!p) return;
